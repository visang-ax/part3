<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>AX Academy 인증 과정 엑셀 업로드</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: #f5f6f8;
    color: #1f2937;
    font-size: 14px;
    line-height: 1.5;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    padding: 40px 44px;
    width: 520px;
    max-width: calc(100vw - 32px);
    text-align: center;
  }
  .card h1 {
    margin: 0 0 8px;
    font-size: 19px;
    font-weight: 700;
    color: #111827;
  }
  .card .desc {
    margin: 0 0 28px;
    font-size: 13px;
    color: #6b7280;
    line-height: 1.6;
  }
  .card .desc code {
    background: #f3f4f6;
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 12px;
  }
  .file-input-hidden { display: none; }
  .btn-upload {
    padding: 14px 32px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.12s;
  }
  .btn-upload:hover { background: #1d4ed8; }
  .btn-upload:disabled { background: #9ca3af; cursor: not-allowed; }
  .status {
    margin-top: 22px;
    font-size: 13px;
    line-height: 1.7;
    color: #374151;
    white-space: pre-line;
    min-height: 1.4em;
  }
  .status.error { color: #dc2626; }
  .status.success { color: #16a34a; font-weight: 600; }
  .status.warn { color: #d97706; font-weight: 600; }
  .btn-view {
    display: none;
    margin-top: 18px;
    padding: 12px 28px;
    border: none;
    border-radius: 8px;
    background: #16a34a;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
  }
  .btn-view:hover { background: #15803d; }
  .btn-view.show { display: inline-block; }
</style>
</head>
<body>
<div class="card">
  <h1>AX Academy 인증 과정 엑셀 업로드</h1>
  <p class="desc">엑셀 파일을 선택하면 브라우저에 저장됩니다.<br>이후 <code>re_SmartLearning_AX_Academy.html</code>을 열면 데이터가 반영됩니다.</p>
  <button class="btn-upload" id="upload-btn">⬆ 엑셀 업로드</button>
  <input class="file-input-hidden" type="file" id="upload-input" accept=".xlsx,.xls,.csv">
  <div class="status" id="status"></div>
  <a class="btn-view" id="view-btn" href="https://visang-ax.github.io/part3/re_SmartLearning_AX_Academy.html">AX Academy 인증 과정 보기</a>
</div>

<script>
const TARGET_FILENAME = 're_SmartLearning_AX_Academy.xlsx';
const STORAGE_ROWS_KEY = 'smartlearningAxAcademyUploadedRows';
const STORAGE_DATE_KEY = 'smartlearningAxAcademyUpdateDate';

function normalizeUploadKey(value) {
  return String(value || '').replace(/\s+/g, '').replace(/[()[\]{}※*·ㆍ._-]/g, '').toLowerCase();
}

function findUploadColumnValue(row, matcher) {
  for (const key of Object.keys(row)) {
    if (matcher(normalizeUploadKey(key))) {
      return row[key] == null ? '' : String(row[key]).trim();
    }
  }
  return null;
}

function isRecognitionColumn(normalizedKey) {
  return normalizedKey.includes('인정여부') ||
    (normalizedKey.includes('ax') && normalizedKey.includes('관련') && normalizedKey.includes('교육') &&
      normalizedKey.includes('yes') && normalizedKey.includes('no'));
}

function shouldImportUploadedRow(row) {
  const recognitionValue = findUploadColumnValue(row, isRecognitionColumn);
  if (recognitionValue === null) return true;
  return recognitionValue.trim().toUpperCase() === 'YES';
}

function readUploadValue(row, candidates, fallbackIndex) {
  const direct = findUploadColumnValue(row, k => candidates.some(c => k === normalizeUploadKey(c)));
  if (direct !== null) return direct;
  const values = Object.values(row);
  return values[fallbackIndex] == null ? '' : String(values[fallbackIndex]).trim();
}

function hasTitle(row) {
  return findUploadColumnValue(row, k => k.includes('과정명') || k.includes('강의명') || k.includes('콘텐츠명') || k.includes('교육명')) !== null
    || Object.values(row)[3];
}

function makeUploadRowKey(row) {
  return String(row.title || '')
    .normalize('NFKC')
    .replace(/[\u200B-\u200D\uFEFF]/g, '')
    .replace(/\s+/g, '')
    .trim()
    .toLowerCase();
}

function dedupeUploadedRows(rows) {
  const seen = new Set();
  return rows.filter(row => {
    const key = makeUploadRowKey(row);
    if (!key || seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function parseUploadedRows(rows) {
  const parsedRows = rows.filter(shouldImportUploadedRow).map(row => ({
    cat1: readUploadValue(row, ['카테고리1', '카테고리 1', '대분류'], 1),
    cat2: readUploadValue(row, ['카테고리2', '카테고리 2', '중분류'], 2),
    title: readUploadValue(row, ['과정명', '강의명', '콘텐츠명', '교육명'], 3),
    duration: readUploadValue(row, ['학습시간', '시간', '러닝타임'], 4),
    contents: readUploadValue(row, ['콘텐츠수', '콘텐츠 수', '차시수', '차시'], 5),
    instructor: readUploadValue(row, ['강사', '강사명', '교강사'], 6),
    summary: readUploadValue(row, ['요약', '과정요약', '개요'], 7),
    goal: readUploadValue(row, ['학습목표', '목표'], 8),
    target: readUploadValue(row, ['학습대상', '대상'], 9),
    curriculum: readUploadValue(row, ['커리큘럼', '교육내용', '목차'], 10)
  })).filter(row => row.title);
  return dedupeUploadedRows(parsedRows);
}

const statusEl = document.getElementById('status');
const uploadBtn = document.getElementById('upload-btn');
const uploadInput = document.getElementById('upload-input');
const viewBtn = document.getElementById('view-btn');

function setStatus(text, kind) {
  statusEl.textContent = text;
  statusEl.className = 'status' + (kind ? ' ' + kind : '');
}

function getErrorMessage(err) {
  if (!err) return '알 수 없는 오류';
  return err.message || String(err);
}

uploadBtn.addEventListener('click', () => uploadInput.click());

uploadInput.addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;

  uploadBtn.disabled = true;
  viewBtn.classList.remove('show');
  setStatus('엑셀 파일을 확인하는 중입니다…');

  try {
    if (!window.XLSX) {
      setStatus('엑셀 분석 라이브러리를 불러오지 못했습니다. 새로고침 후 다시 시도해 주세요.', 'error');
      return;
    }

    const buffer = await file.arrayBuffer();
    const wb = XLSX.read(buffer, { type: 'array', cellDates: false });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval: '', raw: false });
    const titledRows = rows.filter(hasTitle);
    const parsedRows = parseUploadedRows(rows);

    if (!titledRows.length) {
      setStatus('과정명이 있는 엑셀 파일인지 확인해 주세요.', 'error');
      return;
    }

    if (!parsedRows.length) {
      setStatus('인정여부 YES인 과정이 없습니다. 엑셀 내용을 확인해 주세요.', 'error');
      return;
    }

    localStorage.setItem(STORAGE_ROWS_KEY, JSON.stringify(parsedRows));
    localStorage.setItem(STORAGE_DATE_KEY, new Date().toISOString());

    setStatus('전체 ' + titledRows.length + '개 과정 중 ' + parsedRows.length + '개가 저장되었습니다.\n아래 버튼으로 과정 목록을 열어 확인해 주세요.', 'success');
    viewBtn.classList.add('show');
  } catch (err) {
    console.error(err);
    setStatus('엑셀 파일을 처리하는 중 오류가 발생했습니다.\n상세: ' + getErrorMessage(err), 'error');
  } finally {
    uploadBtn.disabled = false;
  }
});
</script>
</body>
</html>

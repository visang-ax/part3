<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>AX Academy 인증 과정 엑셀 업로드</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: #f5f6f8;
    color: #1f2937;
    font-size: 14px;
    line-height: 1.5;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    padding: 40px 44px;
    width: 480px;
    max-width: calc(100vw - 32px);
    text-align: center;
  }
  .card h1 {
    margin: 0 0 8px;
    font-size: 19px;
    font-weight: 700;
    color: #111827;
  }
  .card .desc {
    margin: 0 0 28px;
    font-size: 13px;
    color: #6b7280;
    line-height: 1.6;
  }
  .card .desc code {
    background: #f3f4f6;
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 12px;
  }
  .file-input-hidden { display: none; }
  .btn-upload {
    padding: 14px 32px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.12s;
  }
  .btn-upload:hover { background: #1d4ed8; }
  .btn-upload:disabled { background: #9ca3af; cursor: not-allowed; }
  .status {
    margin-top: 22px;
    font-size: 13px;
    line-height: 1.7;
    color: #374151;
    white-space: pre-line;
    min-height: 1.4em;
  }
  .status.error { color: #dc2626; }
  .status.success { color: #16a34a; font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <h1>AX Academy 인증 과정 엑셀 업로드</h1>
  <p class="desc">엑셀 파일을 선택하면 <code>re_SmartLearning_AX_Academy.xlsx</code>로 저장됩니다.<br>이후 <code>re_SmartLearning_AX_Academy.html</code>을 열면 데이터가 반영됩니다.</p>
  <button class="btn-upload" id="upload-btn">⬆ 엑셀 업로드</button>
  <input class="file-input-hidden" type="file" id="upload-input" accept=".xlsx,.xls,.csv">
  <div class="status" id="status"></div>
</div>

<script>
const TARGET_FILENAME = 're_SmartLearning_AX_Academy.xlsx';

function normalizeUploadKey(value) {
  return String(value || '').replace(/\s+/g, '').replace(/[()[\]{}※*·ㆍ._-]/g, '').toLowerCase();
}

function findUploadColumnValue(row, matcher) {
  for (const key of Object.keys(row)) {
    if (matcher(normalizeUploadKey(key))) {
      return row[key] == null ? '' : String(row[key]).trim();
    }
  }
  return null;
}

function isRecognitionColumn(normalizedKey) {
  return normalizedKey.includes('인정여부') ||
    (normalizedKey.includes('ax') && normalizedKey.includes('관련') && normalizedKey.includes('교육') &&
      normalizedKey.includes('yes') && normalizedKey.includes('no'));
}

function shouldImportUploadedRow(row) {
  const recognitionValue = findUploadColumnValue(row, isRecognitionColumn);
  if (recognitionValue === null) return true;
  return recognitionValue.trim().toUpperCase() === 'YES';
}

function hasTitle(row) {
  return findUploadColumnValue(row, k => k.includes('과정명') || k.includes('강의명') || k.includes('콘텐츠명') || k.includes('교육명')) !== null
    || Object.values(row)[3];
}

const statusEl = document.getElementById('status');
const uploadBtn = document.getElementById('upload-btn');
const uploadInput = document.getElementById('upload-input');

function setStatus(text, kind) {
  statusEl.textContent = text;
  statusEl.className = 'status' + (kind ? ' ' + kind : '');
}

uploadBtn.addEventListener('click', () => uploadInput.click());

uploadInput.addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;

  uploadBtn.disabled = true;
  setStatus('엑셀 파일을 확인하는 중입니다…');

  try {
    const buffer = await file.arrayBuffer();
    const wb = XLSX.read(buffer, { type: 'array', cellDates: false });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval: '', raw: false });
    const titledRows = rows.filter(hasTitle);
    const includedRows = titledRows.filter(shouldImportUploadedRow);

    if (!titledRows.length) {
      setStatus('과정명이 있는 엑셀 파일인지 확인해 주세요.', 'error');
      uploadBtn.disabled = false;
      return;
    }

    setStatus('전체 ' + titledRows.length + '개 과정 중 ' + includedRows.length + '개가 인정여부 YES로 확인되었습니다.\n' + TARGET_FILENAME + '로 저장합니다…');

    const savedInPlace = await saveAsTargetFile(file);

    if (savedInPlace) {
      setStatus(TARGET_FILENAME + ' 저장 완료!\n잠시 후 re_SmartLearning_AX_Academy.html로 이동합니다…', 'success');
      setTimeout(() => { location.href = 're_SmartLearning_AX_Academy.html'; }, 1200);
    } else {
      setStatus(TARGET_FILENAME + ' 다운로드 완료!\n다운로드된 파일을 이 폴더로 옮긴 뒤 re_SmartLearning_AX_Academy.html을 열어 확인해 주세요.', 'success');
    }
  } catch (err) {
    if (err && err.name === 'AbortError') {
      setStatus('저장이 취소되었습니다.');
    } else {
      console.error(err);
      setStatus('엑셀 파일을 처리하는 중 오류가 발생했습니다. 파일 형식을 확인해 주세요.', 'error');
    }
  } finally {
    uploadBtn.disabled = false;
  }
});

// Returns true when the file was written directly to a location the user picked
// (so we can trust it landed next to this page and auto-navigate to the viewer).
async function saveAsTargetFile(file) {
  if (window.showSaveFilePicker) {
    const handle = await window.showSaveFilePicker({
      suggestedName: TARGET_FILENAME,
      types: [{
        description: 'Excel Workbook',
        accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'] }
      }]
    });
    const writable = await handle.createWritable();
    await writable.write(file);
    await writable.close();
    return true;
  }

  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url;
  a.download = TARGET_FILENAME;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  return false;
}
</script>
</body>
</html>

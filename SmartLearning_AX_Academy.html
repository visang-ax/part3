 "instructor": "권오성", "summary": "Jupiter Notebook프로그램을 활용하여 Python의 빠른 개발 속도, 높은 생산성의 특징을 이해하여, 장점을 살린 업무에 적용할 만한 프로그램을 개발할 수 있도록 구성했다.", "goal": "1. Jupiter Notebook을 설치하여 Python 언어 소스를 입력할 수 있다.\n2. Python의 풍부한 라이브러리를 활용하여 업무에 적용할 수 있다.\n3. Python을 통해 데이터 구조와 알고리즘을 분석하고 다룰 수 있다.\n4. 계산기(DTI계산기, DSR계산기 등)와 고객관리 프로그램을 만들 수 있다.", "target": "- 코딩의 심화를 익히고 싶은 전 임직원\n- 파이썬을 통해 프로젝트를 진행하고 싶은 전 임직원", "curriculum": "예금계산기 만들기\n0:31:59\n\n\n적금계산기 만들기\n0:43:09\n\n\n대출계산기 만들기\n0:48:57\n\n\n부동산주택 취득세 계산기 만들기\n0:49:56\n\n\nDTI 계산기 만들기\n1:02:27\n\n\n고객정보 파일관리 및 검색\n1:10:07\n\n\n고객정보 파일 관리\n0:51:14\n\n\n고객정보 쉬트 관리 및 컬럼 관리\n0:54:25\n\n\n고객정보 컬럼 고급 관리\n0:35:20\n\n\n고객정보 병합 및 파일 비교\n0:47:34"}, {"cat1": "IT", "cat2": "IT 프로그래밍", "title": "딥러닝 개발자에게 꼭 필요한 기초 수학", "duration": "20:08:09", "contents": "8", "instructor": "조준우", "summary": "세상에서 가장 꼼꼼한 딥러닝, 그 시작에 필요한 수학 지식부터 딥러닝의 기반을 단단하게 다져드립니다!", "goal": "- 딥러닝 활용의 기초가 되는 수학 지식을 이해할 수 있다.\n- 수학 지식을 기반으로 딥러닝 알고리즘의 원리를 파악하여 업무에 활용할 수 있다.", "target": "- 딥러닝에 관심이 있는 SW 개발자\n- 딥러닝 활용의 기초가 되는 수학 지식이 궁금한 모든 임직원", "curriculum": "함수에 대하여\n1:45:50\n\n\n신경망 첫걸음\n1:55:41\n\n\n역전파를 위한 미분 개념 다지기\n2:43:59\n\n\n최적화 방법 기초 다지기\n1:46:45\n\n\n선형 모델\n3:28:30\n\n\n로지스틱 회귀분석\n1:30:32\n\n\n자동미분에 대하여\n3:11:18\n\n\n다층 신경망\n3:45:34"}, {"cat1": "IT", "cat2": "IT 프로그래밍", "title": "머신러닝의 이해와 실습", "duration": "10:36:35", "contents": "20", "instructor": "양지헌", "summary": "머신러닝 핵심주제를 전반적으로 다루며, 머신러닝의 다양한 주제를 이론과 함께 파이썬 코딩으로 직접 실습해보는 과정으로서, 실제 비즈니스에서 필요로 하는 거의 모든 주제를 경험해볼 수 있습니다", "goal": "머신러닝의 여러 가지 알고리즘을 이해하고 이를 활용하여 파이썬 코딩으로 구현할 수 있다.", "target": "- 머신러닝 초보자\n- 파이썬 기초 가능자\n- 머신러닝 관련 전공자로서 근래의 발전된 내용을 공부하고자 하는 직장인", "curriculum": "머신러닝 개요와 데이터전처리\n0:25:21\n\n\n의사결정트리(Decision Tree)\n0:32:26\n\n\n회귀분석(Regression Analysis)\n0:25:20\n\n\n군집분석(Clustering Analysis)\n0:32:26\n\n\nKNN(K-Nearest Neighbor)\n0:29:07\n\n\n나이브 베이즈(Naive Bayes)\n0:26:29\n\n\nSVM(Support Vector Machine)\n0:29:41\n\n\n텍스트 마이닝(Text mining)\n0:30:40\n\n\n주성분 분석(PCA)과 밀도기반 군집분석(DBSCAN)\n0:27:36\n\n\n신 정 DDDM", "duration": "4:05:18", "contents": "12", "instructor": "신경식", "summary": "데이터 기반 의사결정을 하려면 무엇을? 어떻게? 시작해야 하는가?\n\n데이터를 기반으로 의사결정을 내리면 주관적인 판단과 직관에 의한 결정으로 인한 오류를 최소화할 수 있으며, 다양한 리스크를 사전에 예측하고 빠르게 대처할 수 있습니다. 따라서 데이터 기반 의사결정은 기업이나 조직이 더 나은 의사결정을 내리고 경쟁 우위를 유지할 수 있도록 중요한 요소이기에 해당 과정을 통해 이러한 역량을 강화 시킨다면 데이터를 전략적 무기로 사용할 수 있을 것입니다.", "goal": "1. 데이터 기반 의사결정의 필요성과 기초 개념을 알아본다.\n2. 데이터 기반 의사결정을 위한 데이터 및 시각화 분석 방법에 대한 이해도를 높인다.\n3. 데이터 기반 의사결정을 위한 데이터 모델링, 알고리즘에 대해 파악한다.", "target": "1. 데이터를 활용하는 방법을 알고 싶은 분\n2. 객관적이고 합리적인 의사결정을 하고 싶은 모든 직장인\n3. 데이터를 활용한 혁신과 경쟁력을 확보하고 싶은 모든 임직원", "curriculum": "데이터 기반 의사결정이란 무엇인가?\n0:16:26\n\n\n일상에서 만나는 데이터 기반 의사결정(DDDM)\n0:21:07\n\n\n데이터 기반 의사결정의 프로세스와 장단점\n0:24:17\n\n\n탐색적 데이터 분석(EDA)이란 무엇인가?\n0:23:09\n\n\n기초 통계치 파헤치기 part.1\n0:24:49\n\n\n기초 통계치 파헤치기 part.2\n0:24:08\n\n\n붓꽃 데이터로 살펴본 데이터 분석 방법\n0:18:34\n\n\n데이터 기반 의사결정과 머신러닝\n0:20:01\n\n\n회귀 알고리즘이란 무엇인가?\n0:18:25\n\n\n이웃 데이터 따라 분류하는 KNN Classifier\n0:18:06\n\n\n조건에 따라 값이 변하는 Bayes 정리\n0:18:01\n\n\n머신러닝에 최적화된 Naive Bayes Classifier\n0:18:15"}, {"cat1": "IT", "cat2": "데이터 분석", "title": "딥러닝과 데이터분석을 위한 기초수학 (w.파이썬)", "duration": "7:44:03", "contents": "16", "instructor": "이병준", "summary": "데이터 과학의 기본이 되는 과학적 모델링을 이해하기 위한 기초적인 수학적 지식을 학습합니다. 수학적 지식의 정확한 이해와 코딩능력 함양을 위한 다양한 예제 및 연습문제를 파이썬으로 실습해봅니다.", "goal": "데이터 과학의 기본이 되는 과학적 모델링을 이해하기 위한 기초적인 수학적 지식 학습을 학습하고, 수학적 지식의 정확한 이해 및 코딩 능력 함양을 위한 다양한 예제 및 연습문제를 파이썬을 통해 실습해 볼 수 있다.", "target": "데이터 분석을 위한 기초적인 수학 개념 함양을 원하는 학습자\n(프로그래밍 경험 유무 관련X)", "curriculum": "데이터 과학의 기본 - 함수\n0:29:47\n\n\n함수의 기본 이론\n0:27:35\n\n\n여러 가지 함수 (1) 다항·지수·로그함수\n0:36:37\n\n\n여러 가지 함수 (2) 삼각함수\n0:32:37\n\n\n연속 및 이산 데이터 이해를 위한 도구 - 수열과 함수의 극한\n0:37:35\n\n\n극한의 연속에 대한 이론\n0:25:46\n\n\n인공지능 학습 이해를 위한 필수 아이템 - 미분\n0:40:44\n\n\n미분과 관련된 기본 이론\n0:18:51\n\n\n미분과 관련된 고급 이론\n0:29:02\n\n\n데이터 특성을 추출하는 기본 도구 - 적분\n0:28:48\n\n\n여러 가지 적분법\n0:28:33\n\n\n정적분과 적분의 응용\n0:22:20\n\n\n데이터를 표현하기 위한 도구 - 공간좌표와 벡터\n0:22:44\n\n\n벡터의 내적과 이를 활용한 도형의 방정식\n0:30:59\n\n\n고차원 데이터를 다룰 수 있는 도구 - 역량\n0:15:34\n\n\n평균의 함정\n0:17:29\n\n\n퍼센트를 조심하라\n0:15:01\n\n\n시각화의 오용과 남용\n0:14:56\n\n\n확률에도 종류가 있다!?\n0:17:50\n\n\n확률을 이용한 판단 오류\n0:18:55\n\n\n여론조사 올바로 이해하기\n0:17:18\n\n\n상관관계는 인과관계가 아니다\n0:15:57\n\n\n비교, 어떻게 해야 할까?\n0:14:13\n\n\n어림수의 허와 실\n0:16:32\n\n\n창의성과 분석\n0:18:33"}, {"cat1": "IT", "cat2": "데이터 분석", "title": "설득의 핵심 Key, 시각적 데이터 스토리텔링", "duration": "3:38:27", "contents": "8", "instructor": "전익진", "summary": "이제 구구절절 설명하지 않고 내가 전하려는 핵심 메시지를 스토리로 담아 설득할 수 있습니다.", "goal": "1. 구구절절 설명하지 않고 내가 전하려는 핵심 메시지를 스토리로 담아 설득할 수 있다.\n2. 스토리를 데이터에 담아, 더 시각적으로 전달할 수 있는 능력을 향상 시킬 수 있다.", "target": "전 구성원", "curriculum": "왜 데이터 스토리텔링인가?\n0:21:54\n\n\n데이터로 스토리를 전달하기\n0:30:59\n\n\n상황을 정확히 이해하자\n0:18:46\n\n\n한 눈에 들어오는 시각화 자료 1\n0:25:15\n\n\n한 눈에 들어오는 시각화 자료 2\n0:25:04\n\n\n쓸데없는 것을 과감하게 지우기\n0:26:40\n\n\n설득을 위한 주목 끌기\n0:27:22\n\n\n스토리텔링 설계하기\n0:42:27"}, {"cat1": "IT", "cat2": "데이터 분석", "title": "업무가 쉬워지는 순간, 엑셀로 데이터 분석하기", "duration": "5:52:12", "contents": "16", "instructor": "오경선", "summary": "엑셀의 함수 기능을 활용하여 데이터 분석을 방법을 알려준다.\n데이터 분석의 기본 개념을 다지고, 예제를 통해 차근차근 기능을 직접 따라 하면서 익힐 수 있는 과정으로 구성되어 있다.\n본 학습과정을 통해 엑셀을 이용하여 데이터를 수집하고, 엑셀을 활용하여 분석하는 도구로 자유롭게 활용할 수 있다.", "goal": "1. 데이터의 개념을 알고, 원하는 데이터를 수집하여 다듬는 방법을 알 수 있다.\n2. 가상분석을 설정하고, 다양한 검증 방법을 통해 주장의 참과 거짓을 파악할 수 있다.\n3. 데이터 간의 상관관계를 파악하고, 분석하여 미래를 예측할 수 있다.", "target": "엑셀로 데이터 분석하는 방법에 관심이 있는 구성원", "curriculum": "빅데이터를 알고 데이터 분석 과정 이해하기\n0:22:21\n\n\n다양한 데이터 수집 방법 알아보기\n0:22:49\n\n\n데이터 다듬기(1)\n0:29:45\n\n\n데이터 다듬기(2)\n0:25:24\n\n\n필요한 데이터를 수준 있게 뽑아내기(1)\n0:19:06\n\n\n필요한 데이터를 수준 있게 뽑아내기(2)\n0:19:51\n\n\n데이터 속성 탐색하기\n0:39:25\n\n\n가상분석으로 데이터 예측하기\n0:26:14\n\n\n주장에 대한 참과 거짓 판단하기\n0:25:24\n\n\n주장에 대한 참과 거짓 판단하기(등분산 T-test)\n0:14:07\n\n\n주장에 대한 참과 거짓 판단하기(비동질성 T-test)\n0:15:17\n\n\n주장에 대한 참과 거짓 판단하기(대응표본 T-test/분산분석)\n0:19:04\n\n\n속성간의 관계 찾기\n0:15:27\n\n\n데이터로 미래 예측하기(1)\n0:20:49\n\n\n데이터로 미래 예측하기(2)\n0:25:41\n\n\n여러 데이터로 미래 예측하여 문제 해결하기\n0:11:28"}, {"cat1": "IT", "cat2": "데이터 분석", "title": "업무에 바로 써먹는 데이터 마인드(데이터 리터러시) 향상 방법", "duration": "7:48:43", "contents": "13", "instructor": "구자룡", "summary": "기획자, 마케터가 데이터 분석가보다 더 나은 의사결정을 하는 법!", "goal": "1. 문제해결을 위한 데이터 수집, 분석 방법을 파악할 수 있다.\n2. 트렌드, 텍스트 데이터, A/B테스트, 시각화 데이터 분석방법을 파악할 수 있다.\n3. 데이터를 분석하여 문제를 해결하고, 전략을 수립할 수 있다.", "target": "1. 데이터 기반 의사결정이 필요한 실무자 및 관리자\n2. 시장조사, 트렌드 조사가 필요한 실무자 및 관리자\n3. 사업전략 수립을 위해 데이터 활용이 필요한 기획자, 마케터", "curriculum": "AI와 빅데이터 시대에 필요한 데이터 마인드\n0:29:33\n\n\n문제 해결을 위한 데이터 분석과 기초 통계\n0:39:47\n\n\n문제 해결을 위한 데이터 수집 및 조사 방법\n0:37:19\n\n\n누구나 할 수 있는 셀프 데이터 분석과 그 도구들\n0:36:13\n\n\n데이터 분석(1) 트렌드 분석을 통한 신사업 및 신제품 구상\n0:38:08\n\n\n데이터 분석(2) 텍스트 데이터 분석을 통한 고객 니즈 파악\n0:41:46\n\n\n데이터 분석(3) 통계적 가설 검정을 통한 결론 도출\n0:34:14\n\n\n데이터 분석(4) A/B테스트 분석을 통한 현명한 의사결정\n0:35:24\n\n\n데이터 분석(5) 시각화 분석을 통한 데이터 요약과 통찰\n0:47:39\n\n\n데이터 분석(6) ChatGPT를 이용한 탐색적 데이터 분석\n0:41:24\n\n\n군집 분석을 이용한 고객 세분화와 타깃 마케팅\n0:26:23\n\n\n머신러닝을 이용한 예측 모델링과 고객 클러스터링\n0:28:59\n\n\n데이터 마인드 높이는 방법\n0:31:54"}, {"cat1": "AI", "cat2": "457", "title": "[AI Class] AI 혁명을 이끈 천재들의 비즈니스 인사이트", "duration": "2:32:34", "contents": "12", "instructor": "이승민", "summary": "우리는 왜 기술이 아닌 '사람'을 통해 AI를 배워야 할까?\nAI 혁명을 이끈 천재들에게 배우는 통찰, 기술보다 빛나는 사람의 이야기", "goal": "1. AI 혁신을 이끈 핵심 인물들의 도전과 업적을 파악하고, 급변하는 기술 환경 속에서 개인과 기업이 갖춰야 할 미래 경쟁력이 무엇인지 파악할 수 있다.\n2. AI 기술이 변화시키는 산업 구조와 미래 사회의 거시적 방향성에 대한 인사이트를 얻을 수 있다.\n3. AI 혁명이라는 거대한 흐름 속에서 인간 고유의 역할과 창의적 기회를 발견할 수 있다.", "target": "1. AI의 발전과 이를 통한 미래 인사이트를 파악하고 싶은 직장인\n2. AI 변화의 흐름을 이해하고 트렌드를 알고 싶은 직장인\n3. AI 시대의 의사결정과 문제해결 역량이 요구되는 직장인", "curriculum": "AI 혁명을 이끈 10인의 천재들\n0:10:33\n\n\n제프리 힌튼: 딥러닝의 설계자, AI의 새로운 지평을 열다\n0:10:37\n\n\n데미스 허사비스: AI로 생명의 구조를 풀어내다\n0:10:10\n\n\n젠슨 황: AI 혁명을 가동시킨 승부사, AI 혁명에 불을 지피다\n0:10:34\n\n\n사티야 나델라: MS를 AI 중심의 생태계로 재편하다\n0:11:05\n\n\n일리야 수츠케버: 생성형 AI의 핵심 로직을 구축하여 혁명을 이끌다\n0:14:53\n\n\n리처드 서튼: 지치지 않는 호기심으로 강화학습의 기틀을 세우다\n0:14:36\n\n\n프랑소와 숄레: AI의 한계에 끊임없이 질문을 던지다\n0:13:33\n\n\n안드레이 카파시: 자율주행부터 AI 교육까지, 혁신의 길을 닦다\n0:16:17\n\n\n노암 브라운: 전략적 사고를 뛰어넘는 추론 모델을 개척하다\n0:15:08\n\n\n일론 머스크: 경계 없는 상상력으로 AI의 미래를 앞당기다\n0:12:01\n\n\nAI 혁명을 이끈 천재들에게서 찾아낸 비밀\n0:13:07"}, {"cat1": "AI", "cat2": "457", "title": "[AI 치트키] 업무 순삭의 비밀, Agentic AI", "duration": "3:22:08", "contents": "10", "instructor": "김환", "summary": "업무 효율성과 창의성의 혁신 – Agentic AI \n\nAI는 이제 단순한 자동화를 넘어, 스스로 판단하고 실행하는 새로운 단계로 진화하고 있습니다. Agentic AI는 이러한 변화의 중심에서, 비즈니스와 조직이 더 스마트하게 움직일 수 있도록 돕는 핵심 기술입니다. 이 과정에서는 Agentic AI가 어떻게 의사결정과 실행을 연결하고, 실무에 적용될 수 있는지 명확하고 쉽게 이해할 수 있도록 정리했습니다. 미래를 준비하는 모든 실무자에게 꼭 필요한 지식을 지금 만나보세요.", "goal": "- Agentic AI 개념과 활용 방법을 이해할 수 있다. \n- 다양한 AI 플랫폼을 활용하여 업무 효율을 높일 수 있다. \n- AI 플랫폼 활용 시 발생할 수 있는 보안 이슈를 이해하고, 보다 안전하고 효율적인 AI 활용 전략을 수립할 수 있다.", "target": "- AI를 활용해 업무 효율을 높이고 싶은 실무자\n- 디지털 전환을 추진하는 기획·전략 담당자\n- AI 기반 자동화에서 한 단계 더 나아가고 싶은 개발자·PM", "curriculum": "시키는 AI의 끝, Agentic AI의 등장\n0:26:51\n\n\nNotebookLM & AI 팟캐스트 활용법\n0:19:21\n\n\nChatGPT Agent 기초: 반복 업무 삭제 노하우\n0:17:18\n\n\nChatGPT Agent 심화: 함수·코딩 없는 데이터 분석\n0:17:58\n\n\nClaude Skills: Skill 파일로 정확하게 지시하기\n0:18:59\n\n\nClaude MCP: 데스크탑에서 AI 불러쓰기\n0:20:42\n\n\nGemini Side Panel: 메일 한 통으로 끝내는 회의 준비\n0:16:08\n\n\nGoogle Opal: 나만의 자동화 Agent 만들기\n0:23:25\n\n\nLocal AI Security: 오프라인 AI 활용법\n0:23:56\n\n\nMulti-Agent Leadership: 협업 에이전트 시스템 만들기\n0:17:30"}, {"cat1": "AI", "cat2": "457", "title": "[AI 치트키] 오늘부터 당신도 피지컬 AI 좀 아는 사람", "duration": "3:33:51", "contents": "12", "instructor": "박종성", "summary": "AI, 드디어 몸을 갖다 - 로봇 시대, 나의 생존 전략은?\n\n피지컬 AI는 단순한 로봇이 아닙니다. 인공지능, 로봇공학, 에너지 기술의 대융합이 만들어낸 경제 패러다임의 전복입니다. 본 과정은 피지컬 AI의 등장 배경부터 글로벌 빅테크의 전략, 하드웨어 주권, 그리고 로봇세, 기본소득, 글로벌 불평등 등 미래 사회 이슈까지, 다양한 관점으로 확인할 수 있습니다.", "goal": "- 피지컬 AI로 인한 주요 산업 구조의 변화를 이해하고, 새로운 비즈니스 기회를 모색할 수 있다.\n- 피지컬 AI가 야기하는 사회적/윤리적 이슈를 이해하고, 이에 대한 합리적인 대응 방안을 모색할 수 있다.\n- 다가올 피지컬 AI 시대를 대비해 개인이 취해야 할 커리어 생존 방향을 설계할 수 있다.", "target": "- 피지컬 AI 시대에 대비해야 하는 기획, 전략, 신사업 담당자\n- 피지컬 AI 시대의 사회적, 경제적 변화를 깊이 있게 이해하고 싶은 직장인 L5", "curriculum": "피지컬 AI는 왜 지금 도래했는가?\n0:19:59\n\n\n로봇에게 바퀴 대신 ‘다리’가 필요한 이유는 무엇일까?\n0:17:03\n\n\n만 달러대 로봇 쇼크!\n0:22:33\n\n\n로봇은 현실을 어떻게 이해하고 움직일까?\n0:18:13\n\n\n누가 피지컬 AI 시장을 지배할까?\n0:17:15\n\n\n컨베이어 벨트가 사라진 공장은 어떤 모습일까?\n0:14:32\n\n\n로봇 대중화는 언제, 어떻게 시작될까?\n0:16:58\n\n\n일하는 로봇, 세금은 누가 내야 할까?\n0:18:46\n\n\n인건비 격차가 사라지는 로봇 경제학\n0:18:01\n\n\n로봇이 촉발한 글로벌 경제 불평등의 위기\n0:16:24\n\n\n피지컬 AI, 평화를 지킬까, 전쟁에 쓰일까?\n0:15:32\n\n\n피지컬 AI 시대, 당신의 ‘무기’는?\n0:18:35"}, {"cat1": "AI", "cat2": "457", "title": "[AI 치트키] 인공지능 × 인간지능 새 판짜기", "duration": "2:36:11", "contents": "8", "instructor": "김미경", "summary": "인간 사고 증폭을 위한 인간-AI 협업의 새 프레임\n\n인간의 능력을 최대한 증폭시키기 위해 AI는 어떻게 활용해야 하는가? 창의성의 새로운 판 위에서 인간–AI 협업은 어떤 기준으로 실행되어야 하는가? 그리고 직무와 워크플로우는 어떻게 설계해야 하는가?\n이 과정은 이러한 질문에 답할 수 있는 새로운 틀과 실행 전략을 제시한다.", "goal": "창의성에 대한 확장된 개념과 새로운 평가 관점을 이해한다.\n인간–AI 협업 기반의 창의성 증폭 메커니즘과 협업 모델을 이해한다.\n생성형 AI의 기술적 특성과 한계를 고려한 활용·관리 기준을 수립한다. \nAI–인간 협업 관점에서 창의적 직무 변화와 실행 방향을 도출한다.", "target": "- AI를 활용하여 창의적 생산성을 높이고자 하는 모든 직장인\n- AI와 인간 협업을 통한 업무 체계와 조직 구조를 마련하고자 하는 모든 비즈니스 리더 및 실무자", "curriculum": "창의성의 개념과 확장된 이해\n0:20:51\n\n\n창의성 증폭의 메커니즘: 인간·AI·환경의 상호작용\n0:18:04\n\n\n하이브리드·에이전틱 지능의 시대\n0:21:01\n\n\nAI-인간 협업 모델과 협력적 창의성의 구현\n0:21:27\n\n\nAI가 바꾸는 창의산업의 현장\n0:22:47\n\n\n생성형 AI의 기술적 특성과 한계\n0:15:19\n\n\n인공지능 시대의 인간 역량과 윤리적 책임\n0:16:43\n\n\nAI-인간 협업 기반의 창조적 직무 혁신\n0:19:59"}, {"cat1": "AI", "cat2": "457", "title": "AI Vibe(바이브) 코딩으로 TodoList App 하루 만에 만들기 Part.1 바이브 코딩이란, Cursor AI", "duration": "1:43:14", "contents": "4", "instructor": "김동준", "summary": "본 과정은 커서 AI 인공지능 Cursor AI 툴을 사용하여 TodoList 앱을 질문만으로 만들어보는 동영상 과정입니다.", "goal": "최신 AI 인공지능 툴을 사용하여 웹 프로그램을 개발합니다.", "target": "커서 AI 인공지능 툴을 사용하여 질문만으로 애플리케이션 만드는 과정을 배우고자 하는 사람", "curriculum": "DEMO 미리보기 및 바이브 코딩이란 무엇인가\n0:15:05\n\n\nCursor AI 편집기는 무엇인가 vs 자주 묻는 질문 FAQ\n0:34:11\n\n\nCursor AI 설치 및 무료 이용하는 방법\n0:24:36\n\n\nCursor AI 기초 사용법\n0:29:22"}, {"cat1": "AI", "cat2": "457", "title": "AI Vibe(바이브) 코딩으로 TodoList App 하루 만에 만들기 Part.2 TodoList 앱 실습", "duration": "4:13:07", "contents": "8", "instructor": "김동준", "summary": "본 과정은 커서 AI 인공지능 Cursor AI 툴을 사용하여 TodoList 앱을 질문만으로 만들어보는 동영상 과정입니다.", "goal": "최신 AI 인공지능 툴을 사용하여 웹 프로그램을 개발합니다.", "tar {"cat1": "AI", "cat2": "457", "title": "AI 마케터 시대, 생성형 AI와 팀플레이하기", "duration": "3:35:32", "contents": "8", "instructor": "노준영", "summary": "AI가 일상에 완전히 들어온 '베타세대' 시대의 마케팅 성공을 위해 생성형 AI는 필수적인 협력 대상입니다.\n예측하기 어려운 대중의 마음과 마케팅 프로젝트의 높은 리스크를 AI를 통해 보완하고, 전략 부재로 인한 실패를 방지하는 새로운 패러다임을 제안합니다.\n브랜딩과 개인화 마케팅을 통해 세상에 하나뿐인 브랜드와 콘텐츠를 제작하는 방법을 제시합니다.", "goal": "- 생성형 AI의 기본적인 개념과 마케팅 영역에서의 역할 및 중요성을 이해할 수 있다.\n- 생성형 AI를 활용한 마케팅 전략 수립 및 실무 적용 방안을 습득할 수 있다.\n- 브랜딩, 개인화 마케팅, 콘텐츠 제작 등 다양한 마케팅 활동에 AI를 효과적으로 접목하는 방법을 배울 수 있다.\n- 생성형 AI와의 효율적인 소통을 위한 프롬프트 활용 기초 기술을 익힐 수 있다.", "target": "- 마케팅/기획 분야에서 생성형 AI 활용법에 대한 기초 지식이 필요한 실무자\n- 마케팅 효율을 높이고, 리스크를 줄이며 전략적인 접근을 원하는 담당자", "curriculum": "생성형 AI, 무엇이고 왜 주목받는가? 생성형 AI의 세계로 초대\n0:26:23\n\n\n왜 지금, 생성형 AI 마케팅인가? 놓칠 수 없는 이유 3가지\n0:26:08\n\n\n마케팅의 판을 바꾸는 생성형 AI 4가지 필살 전략\n0:25:48\n\n\n생성형 AI로 짜는 마케팅 전략, 이렇게 시작하자! 4가지 핵심 키워드\n0:26:59\n\n\n생성형 AI로 브랜드에 영혼을, 차별화 브랜딩 3가지 포인트\n0:27:55\n\n\n생성형 AI가 만드는 차원이 다른 개인화 마케팅\n0:26:44\n\n\n생성형 AI 손으로 빚어낸 매력적인 콘텐츠의 비밀\n0:29:02\n\n\n생성형 AI와 대화하는 기술, 프롬프트 활용 기법\n0:26:33"}, {"cat1": "AI", "cat2": "457", "title": "AI 생성 이미지로 완성하는 일러스트 실무 (Illustrator AI)", "duration": "2:49:18", "contents": "6", "instructor": "김기민", "summary": "· 그림 실력이 없어도 누구나 쉽게 시작할 수 있도록, AI 일러스트 제작의 기본 개념부터 실무 활용까지 단계적으로 학습합니다. · 텍스트 입력만으로 이미지를 만들어내는 프롬프트 작성법을 익히고, 원하는 스타일과 분위기를 효과적으로 표현하는 방법을 이해합니다. · 다양한 AI 이미지 생성 도구를 활용하여 캐릭터, 배경, 콘텐츠용 일러스트 등을 직접 제작하며 창작 역량을 확장합니다. · 생성된 이미지를 수정·보완하는 방법까지 함께 익혀, 개인 창작물, SNS 콘텐츠, 굿즈 제작 등 실생활에 바로 활용 가능한 결과물을 완성합니다.", "goal": "· AI 이미지 생성 도구의 기본 원리와 기능을 이해하고, 스스로 원하는 이미지를 기획하고 생성할 수 있습니다. · 목적과 주제에 맞는 프롬프트를 작성하여 스타일, 분위기, 구도, 디테일을 효과적으로 제어할 수 있습니다. · 다양한 AI 도구를 활용해 캐릭터, 배경, 아이콘, 콘텐츠용 이미지 등 여러 유형의 일러스트를 제작할 수 있습니다. · 생성된 이미지를 수정·보완하고 개선하는 과정을 통해 결과물의 완성도를 높일 수 있습니다. · AI 일러스트 제작 과정을 전반적으로 이해하고, 개인 창작, SNS 콘텐츠, 간단한 디자인 작업 등에 능동적으로 활용할 수 있습니다.", "target": "· AI 기능이 탑재된 최신 Illustrator 2025를 체계적으로 배우고 싶은 초중급 학습자 · 아이콘, 그래픽 요소, 패턴, 포스터 등 실무에 활용 가능한 벡터 디자인을 직접 제작하고 싶은 예비 디자이너 · AI 기반 디자인 자동화와 효율적인 작업 방식으로 생산성을 높이고자 럿으로 업데이트하는 MS365 6개 툴별 실무 핵심 기능\n엑셀, 워드, 파워포인트, 아웃룩, 원노트, 팀즈까지,\n회사에서 매일 쓰는 툴의 활용능력이 코파일럿을 만나면 갑자기 레벨업 된다?\n많은 시간을 들여 기능을 하나하나 외워야 하는 OA 클래스가 없이도\n나만의 업무 비서 코파일럿의 도움을 받아 필요한 결과물을 쉽게 얻을 수 있다.\n본 과정은 코파일럿의 개념과 기본 사용법부터 시작하여, 업무 흐름에 따라 회의부터 자료 작성, 분석, 발표까지 업무 흐름에 따라 코파일럿을 활용해 업무 효율을 극대화할 수 있는 기능들을 안내한다. MS365 MVP 출신 전문가가 알려주는 툴별 맞춤형 프롬프트를 바로 실무에 적용할 수 있다.", "goal": "- Microsoft 365 코파일럿의 역할과 주요 기능을 이해할 수 있다.\n- 원노트, 아웃룩, 팀즈, 워드, 엑셀, 파워포인트에서 코파일럿을 활용하여 생산성을 증대시킬 수 있다.\n- 상황별 맞춤형 프롬프트를 작성하여 코파일럿의 효율을 극대화할 수 있다.", "target": "- Microsoft 365 코파일럿을 활용해 생산성을 높이는 방법을 알고 싶은 직장인\n- AI와 데이터를 업무에 적용하여 비즈니스 인사이트를 도출하고자 하는 실무자\n- 코파일럿 도입을 고려하고 있는 경영자", "curriculum": "코파일럿 소개 및 기본 설정\n0:26:00\n\n\n[회의] 코파일럿X원노트 코파일럿과 함께 하는 기록의 혁신\n0:25:43\n\n\n[회의] 코파일럿X아웃룩 업무 공유의 핵심, 아웃룩도 코파일럿으로 편리하게 쓰기\n0:26:24\n\n\n[협업] 코파일럿X팀즈 실무 협업 필수툴 팀즈로 실시간 소통부터 공동 편집까지\n0:29:11\n\n\n[회의] 코파일럿X워드 AI와 협업하는 실무자를 위한 워드 핵심 기능 A to Z\n0:23:42\n\n\n[회의] 코파일럿X워드 코파일럿과 함께하는 실전 문서 작성 가이드\n0:21:36\n\n\n[데이터 분석 및 시각화] 코파일럿 X 엑셀 ① 업무 효율을 높이는 엑셀 핵심 가이드\n0:26:52\n\n\n[데이터 분석 및 시각화] 코파일럿 X 엑셀 ② 코파일럿과 대화하기 위한 엑셀 기본기 완전 정복\n0:30:54\n\n\n[데이터 분석 및 시각화] 코파일럿 X 엑셀 ③ 코파일럿으로 함수 활용 업그레이드하기\n0:28:27\n\n\n[데이터 분석 및 시각화] 코파일럿 X 엑셀 ④ 엑셀 최적화 프롬프트로 엑셀 활용 업그레이드하기\n0:31:48\n\n\n[발표자료 작성] 코파일럿X파워포인트 ① 퀄리티가 달라지는 핵심 편집 스킬\n0:27:51\n\n\n[발표자료 작성] 코파일럿X파워포인트 ② 실전 코파일럿으로 발표자료 만들기\n0:26:20"}, {"cat1": "AI", "cat2": "", "title": "[AI Class] 트렌디한 검색 AI 퍼플렉시티(Perplexity)로 출처 기반 리서치 완성하기", "duration": "3:03:23", "contents": "6", "instructor": "오복실", "summary": "실시간 검색과 확실한 출처 기반 인사이트 도출에 강한 퍼플렉시티(Perplexity) AI로 완성하는 리서치 자동화!", "goal": "- 퍼플렉시티 정보 탐색부터 자동화 적용까지의 업무를 이해할 수 있다.\n- 텍스트 분석, 이미지 제작, 반복 업무 자동화를 아우르는 실무 중심 워크플로우를 구성할 수 있다.\n- 다양한 실무 상황에서 퍼플렉시티를 활용한 리서치를 활용할 수 있다.", "target": "- 검색 결과를 신뢰할 수 있는 요약본과 출처로 정리하고 싶은 리서처\n- 방대한 자료를 빠르게 분석해 인사이트를 도출해야 하는 기획자\n- AI를 활용해 콘텐츠 제작과 정보 큐레이션을 고도화하려는 크리에이터\n- ChatGPT 이후의 리서치 도구를 고민하는 AI 기반 정보 활용자", "curriculum": "퍼플렉시티(Perplexity) AI 기본 이해\n0:26:21\n\n\n퍼플렉시티(Perplexity) AI 기본 기능\n0:30:58\n\n\n효율적인 프롬프트 작 AI시대 최후의 직장인, 문제 해결사\n0:15:53\n\n\nWhy?로 시작해서 Anything Else?로 끝나는 질문의 기술\n0:14:44\n\n\n쪼개서 보기의 마법, 로직트리의 개념과 실전 적용\n0:18:19\n\n\n고객관점에서 바라보기, 고객여정지도와 고객 페르소나 작성\n0:15:48\n\n\n입체적 문제 정의의 기술\n0:09:26\n\n\n문과생도 알 수 있는 분석적 접근방법의 기술\n0:25:02\n\n\n이과생도 알 수 있는 창의적 접근방법의 기술\n0:17:02\n\n\nHIPS 프로세스 실전 활용을 위한 팁\n0:04:12"}, {"cat1": "AI", "cat2": "", "title": "AI 시대의 올바른 판단을 위한 AI 윤리와 리터러시", "duration": "1:54:30", "contents": "8", "instructor": "이상욱", "summary": "AI에게 결정을 위탁한 시대,\n‘AI에게 지배당할 것인가, 지배할 것인가’를 결정하는 것은 AI 활용 스킬이 아닌 인간 고유의 ‘윤리적 감각’!\n\n\n지금 가장 핫한 AI 윤리 이슈와 리스크를 사례, 법규, 업무 적용을 통해 알려주는 강의\n\n- AI를 맹신하지 않고, 제대로 질문하고 판단하는 힘을 기르기 위한 윤리적 분별력을 기르는 법 제시\n- AI 윤리 분야 특강 섭외 1순위, 한양대 철학/인공지능학과 이상욱 교수 직강\n- OECD, EU, UNESCO, 인공지능 기본법 등 국내외 AI 규제의 방향을 짚어주는 강의", "goal": "- AI 사용과 관련된 주요 윤리적 쟁점을 식별할 수 있다.\n- 국제 규범 트렌드를 통해 AI를 활용한 업무 상황에서 발생할 수 있는 리스크를 분석할 수 있다.\n- AI를 책임 있게 활용하기 위한 AI 리터러시 기반의 실천 전략을 제시할 수 있다.", "target": "- 생성형 AI를 실무에서 활용하는 모든 직장인\n- AI 활용 가이드라인과 법적 책임이 궁금한 직장인\n- 생성형 AI 도입 전략을 가지고 있는 조직 리더", "curriculum": "AI 윤리는 기업 활동을 제한하는 규제인가\n0:14:59\n\n\nAI 시대의 성패를 가르는 역량, 왜 ‘AI 리터러시’인가\n0:14:41\n\n\n인류의 진화는 AI와 함께 한다\n0:14:05\n\n\nAI가 아무리 똑똑해져도 당신이 대체불가능한 이유\n0:14:17\n\n\n환각 없는 AI가 영원히 개발될 수 없는 이유\n0:14:37\n\n\n스마트하게 뽑은 저작물, 회사는 법정 분쟁에 휘말릴 수 있다\n0:13:09\n\n\nAI에 대한 무한 신뢰가 섀도우 AI를 부른다\n0:14:52\n\n\n다정한 AI와는 정서적 거리 두기가 필수적이다\n0:13:50"}, {"cat1": "AI", "cat2": "", "title": "AI가 훔쳐간 인문학", "duration": "2:00:36", "contents": "8", "instructor": "김철수", "summary": "\"AI가 훔쳐가 인문학\" 의 저자, 김철수 소장의 철학적 질문을 바탕으로 AI시대를 살아가야 할 현대인에게 삶의 통찰과 지혜를 제시합니다.", "goal": "1. AI와 공존하며 살아가야 하는 시대, 철학적 질문을 바탕으로 삶의 통찰력과 지혜를 얻어갈 수 있다.\n2. AI시대 필요한 기술과 사고의 방법 학습으로 미래에 대비할 수 있다.", "target": "인공지능 및 인문학에 관심 있는 모든 사람", "curriculum": "AI도 감정을 느낄까?\n0:15:16\n\n\nAI도 걱정을 할까?\n0:15:07\n\n\nAI도 억울할까?\n0:14:53\n\n\nAI도 딴생각을 할까?\n0:16:05\n\n\nAI도 죽음을 두려워할까?\n0:14:45\n\n\nAI도 상상할 수 있을까?\n0:15:16\n\n\nAI도 깨달음을 얻을까?\n0:14:23\n\n\nAI는 정말 인간의 뇌를 모방했나?\n0:14:51"}, {"cat1": "AI", "cat2": "", "title": "AI에게 좋은 답을 얻으려면, AI처럼 생각하라! 컴퓨팅 사고력", "duration": "4:36:49", "contents": "12", "instructor": "전수진, 박주연, 김수환", "summary": "인공지능이 사람의 영역을 대체해 가고 있는 시대, 복잡한 문제를 단순화하고 논리적으로 해결하는 컴퓨터 문제 해결 능력 이해가 필수! \n직장인 일잘러의 기본은 효율적인 일처리! 이를 위해서는 업무 내용을 빠르게 파악하고, 복잡한 업무를 알기 쉽게 쪼개고, 업무에 꼭 필요한 정보를 분석해서 단계적으로 처리하는 능력입니다. 이게 바로 컴퓨팅 사고력(Computational Thinking)으로 복잡하고 어려운 문제를 분해, 추상화, 패턴인식, 알고리즘 등 컴퓨터 과학의 기본 원리를 적용하여 창의적이고 논리적으로 문제를 해결하고자 하는 사고방식입니다.", "goal": "1. 컴퓨팅 사고력의 필요성과 개념을 이해할 수 있다.\n2. 컴퓨팅 사고력의 하위요소인 문제해결, 패턴인식, 추상화, 알고리즘, 자동화 기법을 활용하여 다양한 문제 상황에 적용해 볼 수 있다.", "target": "컴퓨팅 사고력에 기반한 문제해결에 관심있는 구성원", "curriculum": "문제를 해결하는 새로운 시각이 필요해\n0:25:55\n\n\n컴퓨터는 이진표현으로부터 시작해\n0:26:34\n\n\n컴퓨터는 멀티미디어도 숫자로 표현해\n0:30:20\n\n\n컴퓨팅 사고력 기반 문제해결 사례\n0:30:05\n\n\n크고 복잡한 문제는 분해하자\n0:20:53\n\n\n공통의 패턴을 찾으면 문제해결이 쉬워져\n0:19:35\n\n\n핵심요소를 찾아서 단순하게 추상화하자\n0:21:15\n\n\n자동화를 위해서는 정확한 알고리즘이 필요해\n0:18:05\n\n\n알고리즘은 순서가 중요해\n0:26:42\n\n\n조건에 따라 결과가 달라져\n0:21:36\n\n\n반복을 찾으면 효율적이야\n0:16:44\n\n\n효율적 자료 관리를 위해 구조화시키자\n0:19:05"}, {"cat1": "AI", "cat2": "", "title": "AI와 플러그인으로 Figma에 날개 달기", "duration": "4:49:08", "contents": "11", "instructor": "김대일", "summary": "디자이너들에게 가장 각광받는 툴, Figma\nAI활용과 무료 플러그인으로 남들보다 쉽고, 빠르고, 퀄리티 있게 디자인하자! \n본 과정을 통해 Figma의 기초 개념부터 바로 사용할 수 있는  툴 사용법까지. 실제 실무에서 작업하는 방식을 따라하며, 원하는 결과물을 빠르게 뽑아낼 수 있는 피그마 A to Z를 배울 수 있다.", "goal": "- Figma의 기본 기능과 플러그인 활용 방법을 알 수 있다.\n- 인공지능 플러그인을 활용한 고효율 작업 방식을 경험할 수 있다.\n- 최종 프로젝트를 통한 실제 앱 화면을 디자인할 수 있다.", "target": "- Figma를 배우고 싶은 직장인\n- UI/UX 디자인 기술을 향상시키고 싶은 디자이너\n- 인공지능을 활용하여 작업 효율을 높이고자 하는 프로덕트 디자이너 및 웹 디자이너\n- AI를 활용한 디자인 시스템과 컴포넌트 관리에 관심 있는 모든 디자인 관련 직군의 직장인", "curriculum": "Figma의 시작, 플러그인 탐색과 요소 이해하기\n0:27:14\n\n\n실전(1): 와이어프레임 그리기\n0:31:02\n\n\n실전(2): 플러그인 활용 스타일 등록하기\n0:28:16\n\n\n실전(3): 오토레이아웃 실행하기\n0:29:16\n\n\n실전(4): 프로퍼티와 베리언트 사용하기\n0:28:39\n\n\n실전(5): 플러그인 활용 UI요소 만들기\n0:32:39\n\n\n실전(6): 텍스트 필드와 컴포넌트 관리\n0:26:23\n\n\n실습(1): 앱 화면 만들기\n0:22:36\n\n\n실습(2): 상품 페이지 만들기\n0:20:41\n\n\n실습(3): AI 플러그인 활용하기\n0:25:04\n\n\n실습(4): 피그잼 AI 활용하기\n0:17:18"}, {"cat1": "AI", "cat2": "", "title": "Chat GPT 질문법, 똑똑한 사람은 어떻게 생각하고 질문하는가?", "duration": "3:00:46", "contents": "8", "instructor": "이시한", "summary": "생성형 AI의 시대, 제대로 된 질문이 정답보다 중요합니다.", "goal": "- 생성형 AI를 업무에 활용하기 위한 다양한 사고법과 질문하는 방법을 학습합니다.", "target": "-  전 임직원", "curriculum": "질문하기 전에 생각해야 하는 것들\n0:21:47\n\n\n업무에서의 인사이트를 어떻게 높일 것인가?\n0:19:00\n\n\n질문을 활용하여 자신을 업그레이드 하기\n0:22:01\n\n\n질문을 통해 다른 사람과 소통하기\n0:25:28\n\n\n관계를 주도하는 질문의 방법\n0:20:47\n\n\nAI가 없는 직장은 상상할 수 없게 되었다\n0:33:17\n\n\nAI를 업무에 최적화하는 질문법\n0:22:48\n\n\nAI의 능력을 최대한 끌어내는 질문법\n0:15:38"}, {"cat1": "AI", "cat2": "", "title": "Chat GPT, DALL-E로 배우는 생성형 AI의 핵심원리", "duration": "7:48:52", "contents": "16", "instructor": "유재명", "summary": "바야흐로 인공지능의 시대, 나만의 인공지능을 만들 수 있을까? 2007년 아이폰의 등장 이후 4차 산업혁명을 또다시 뒤흔든 OpenAI사의 Chat GPT와  DALL=E. 국내외 굴지의 기업들이 이 기술에 주목해 너도 나도 뛰어들고 있습니다.", "goal": "- 자연어 처리/컴퓨터 비전의 개념과 다양한 응용 분야를 이해할 수 있다,\n- GPT모델을 통한 텍스트 생성/CLIP모델, 콜랩, 허깅페이스 등을 통해 이미지 생성을 할 수 있다.", "target": "- 생성형 인공지능(Chat GPT, Dall-E)의 원리에 대해 관심있는 구성원", "curriculum": "자연어 처리와 ChatGPT의 원리\n0:23:57\n\n\n단어 세기에서 머신러닝까지\n0:30:18\n\n\n자연어처리를 위한 딥러닝 모형은 무엇이 있을까?\n0:28:41\n\n\nChatGPT의 T, 트랜스포머 사용해보기\n0:31:58\n\n\n챗봇의 핵심 작동 원리 문서 유사도\n0:28:14\n\n\n문서 유사도를 실습해보자!\n0:38:17\n\n\nChatGPT는 어떻게 문장을 만들까?\n0:30:25\n\n\nGPT 모델로 직접 문장을 생성해보자!\n0:35:53\n\n\n컴퓨터 비전과 DALL-E의 원리\n0:25:51\n\n\n머신러닝을 위한 이미지 불러오기\n0:26:07\n\n\nAI는 이미지를 어떻게 보는가?\n0:25:44\n\n\n이미지를 분류하고 물체를 찾아보자\n0:43:16\n\n\n이미지 검색의 원리!\n0:23:05\n\n\n이미지 임베딩 실습하기\n0:21:29\n\n\nDALL-E는 어떻게 그림을 그리는가?\n0:23:45\n\n\nDALL-E와 함께 그림을 그려보자!\n0:31:52"}, {"cat1": "AI", "cat2": "", "title": "Chat GPT, 내 동료가 되어라!", "duration": "2:37:43", "contents": "10", "instructor": "이시한", "summary": "Chat GPT,  우리는 어떻게 기회를 만들어갈 것인가?", "goal": "- 이론적 정의부터 Chat GPT가 이끈 각계각층의 변화를 살펴보고, 미래 인재 경쟁력(아이디어를 갖고, AI를 잘 활용하는 인간)에 대해 이해할 수 있습니다.\n- 검색과 가상의 마케팅 사례 등을 바탕으로 Chat GPT의 활용 방안을 확인할 수 있습니다.", "target": "-  전 구성원", "curriculum": "Chat GPT는 왜 이렇게 ‘핫’할까?\n0:17:26\n\n\nChat GPT가 바꿔 놓을 패러다임\n0:17:07\n\n\nChat GPT가 지금까지 이루어 놓은 일들\n0:17:44\n\n\nChat GPT는 우리의 미래를 어떻게 바꿀까?\n0:14:44\n\n\nChat GPT가 드리울 그늘과 그에 대한 해법\n0:14:54\n\n\nChat GPT를 활용한 업무 능률 향상 방법들\n0:13:52\n\n\n마케팅에 쓰이는 Chat GPT\n0:16:08\n\n\n개인의 자기계발을 하는데 쓰이는 Chat GPT\n0:13:15\n\n\nChat GPT가 만드는 의외의 변화\n0:15:58\n\n\nChat GPT의 시대에 필요한 개인의 능력들\n0:16:35"}, {"cat1": "AI", "cat2": "", "title": "ChatGPT 더 잘 사용하기, 프롬프트 엔지니어링", "duration": "3:20:21", "contents": "15", "instructor": "서승완", "summary": "AI 활용을 위한 실전 필수 역량, 프롬프트 엔지니어링\n빠르게 변화하는 산업 환경에 따라 업무 프로세스 또한 빠르게 변화하고 있습니다. \n생성형 AI의 활용은 이러한 변화에 대응하는 핵심 도구로 부상하고 있으며, 프롬프트 엔지니어링은 AI를 활용하기 위한 필수 역량입니다.\n올바르고 정확한 프롬프트를 통해 업무 생산성을 강화하고 비즈니스의 경쟁력을 강화할 수 있는 핵심 역량을 학습해 보세요.", "goal": "- 프롬프트 엔지니어링에 대한 기본 개념과 원칙을 이해하여 AI툴을 단순히 이용하는 사용자가 아닌, 프롬프트 엔지니어링을 통해 효과적인 AI툴 활용으로 업무 효율성을 높일 수 있습니다. \n- 강의에서 설명되는 총 12가지의 기법을 통해 효과적으로 AI툴과 상호 작용하여 학습자가 원하는 정확하고 높은 품질의 답변을 얻을 수 있습니다.", "target": "- 업무에서 AI를 효과적으로 사용하여 시간을 효율적으로 사용하길 원하는 학습자", "curriculum": "프롬프트의 중요성 이해하기\n0:05:38\n\n\n프롬프트 구성 원칙 5가지\n0:07:31\n\n\n프롬프트 필수 개념\n0:11:04\n\n\nFew Shot 기법 - 예시를 주는 프롬프팅\n0:11:56\n\n\n역할 지정 기법 - 페르소나 부여하기\n0:13:44\n\n\n마크다운 활용 기법(1) - 마크다운과 후카츠\n0:19:39\n\n\n마크다운 활용 기법(2) - 형식 지정과 슌스케\n0:14:01\n\n\nQ&A 기법 - 질문과 답변 구성\n0:14:40\n\n\n이어쓰기 기법 - 보고서 작성하기\n0:21:16\n\n\nChain of Thought와 감정 프롬프팅\n0:14:28\n\n\n멀티 페르소나 기법 - 다양한 의견 도출하기\n0:10:00\n\n\n할루시네이션 유도와 억제\n0:13:32\n\n\n업무에 도움이 되는 다양한 프롬프팅\n0:19:30\n\n\n맞춤형 지시와 프롬프트 공유\n0:11:49\n\n\nClaude를 위한 프롬프트 엔지니어링\n0:11:33"}, {"cat1": "AI", "cat2": "", "title": "ChatGPT 마스터 클래스 : 남들보다 100배 더 잘 쓰기 위한 활용법 A to Z", "duration": "11:40:02", "contents": "19", "instructor": "최정아", "summary": "어떻게하면 남들보다 ChatGPT를 효과적으로 활용할 수 있을까? \n원하는 비즈니스 환경에서 ChatGPT를 호출하여 편리하고, 효과적으로 활용할 수 있는 방법을 알려드립니다!", "goal": "- ChatGPT의 활용법을 파악하여 목적에 따라 ChatGPT를 효과적으로 사용할 수 있다. \n- 구글 스프레드 시트 등 다양한 연동 서비스를 활용해 생산성을 극대화 할 수 있다. \n- 원하는 비즈니스 환경에서 ChatGPT를 호출하여 편리하고, 효과적으로 작업할 수 있다. \n- ChatGPT의 고급스킬 및 응용법을 학습하여 프롬프트 엔지니어링으로 구체적인 명령을 수행할 수 있다.", "target": "- ChatGPT를 마스터하여 업무의 생산성을 극대화시키고자 하는 직장인 \n- ChatGPT 고급  구축하는 실습 중심 강의\n\n생성형 AI 챗봇 시스템 제작 실습부터 LCEL 활용법까지 Langchain과 RAG 활용법 정복!\n\n본 과정을 통해 많은 분야에서 AI 기술이 필수적인 지금, Langchain과 RAG를 마스터하여 AI 솔루션 개발 역량과 경쟁력을 강화할 수 있다.", "goal": "- Langchain의 주요 개념을 이해하고, 이를 기반으로 RAG 파이프라인을 설계할 수 있다.\n- 실습을 통해 LCEL 기반 RAG 파이프라인을 설계, 구축, 최적화할 수 있다.\n- 프론트엔드(HTML/CSS, JavaScript)와 백엔드(FastAPI)의 통합을 통해 맞춤형 AI 챗봇 인터페이스를 구축할 수 있다.\n- 실제 비즈니스 성공 사례를 분석하여 RAG 서비스 도입을 위한 최적의 전략을 수립할 수 있다.", "target": "- AI 챗봇 시스템의 기초부터 구축 방법까지 배우고 싶은 모든 직장인\n- AI 챗봇과 RAG 서비스 구현에 관심 있는 개발자 및 엔지니어\n- 생성형 AI 기술을 실무에 적용하여 업무 효율을 높이고자 하는 모든 직장인", "curriculum": "RAG의 기초 이해\n0:16:54\n\n\nRAG 파이프라인과 실제 적용 사례\n0:22:02\n\n\nLangchain의 이해와 활용\n0:20:02\n\n\nRAG 구성 요소 실습 - Models\n0:36:42\n\n\nRAG 구성 요소 실습 - Prompt Templates\n0:24:20\n\n\nRAG 구성 요소 실습 - Document Loaders\n0:27:52\n\n\nRAG 구성 요소 실습 - Text Splitters\n0:22:32\n\n\nRAG 구성 요소 실습 - Embeddings\n0:23:20\n\n\nRAG 구성 요소 실습 - 검색 및 데이터 관리\n0:26:42\n\n\nLCEL 소개 및 기본 실습\n0:32:33\n\n\nLCEL을 활용한 RAG 파이프라인 구성 실습\n0:26:05\n\n\n고급 RAG 기법 - 다중 쿼리 생성 및 재정렬 기법\n0:14:19\n\n\n고급 RAG 기법 - 맥락 압축 및 HyDE 기법\n0:18:07\n\n\nStreamlit을 활용한 RAG 챗봇 구현\n0:23:29\n\n\nStreamlit을 활용한 RAG 챗봇 - 대화 이력 관리와 메모리 구현\n0:23:25\n\n\nFastAPI를 활용한 RESTful API 서비스 설계\n0:31:02\n\n\n챗봇 인터페이스 구현을 위한 프론트엔드 통합 실습\n0:27:29"}, {"cat1": "AI", "cat2": "", "title": "Next Level 기획자_AI 서비스 기획의 기술", "duration": "4:25:07", "contents": "16", "instructor": "민규식", "summary": "AI 시대, 기획자의 역량은 다시 정의되고 있습니다. AI, 구경만 하는 기획자로 남으시겠습니까? \n기존 서비스에 AI를 입히고, 전혀 다른 혁신 서비스를 기획할 수 있는 역량이 필요한 모든 기획자에게 이 과정이 ‘실현 가능한 방법과 길’을 안내합니다.", "goal": "- AI 적용 사례를 통해 현업에서 기획 가능 영역을 파악한다.\n- 직접 학습·API·오픈소스·상용 모델 등 상황별 적용 방법을 이해하고 적절한 모델을 선택할 수 있다.\n- AI 모델 최적화 및 최신 기술 동향, 비용 등 현실적 요소를 반영해 실무적 의사결정을 내릴 수 있다.\n- 윤리·보안 관점을 반영하여 기획을 수행할 수 있다.", "target": "- 서비스〮제품〮플랫폼 등 모든 비즈니스 영역에 AI를 도입하고자 하는 기획 실무자 및 관리자\n- 개발자, 개발자 모두 가능\n- 사전 지식 필요 없음", "curriculum": "AI의 기초\n0:15:36\n\n\nAI의 적용 사례 1 (기술)\n0:15:22\n\n\nAI의 적용 사례 2 (서비스)\n0:10:55\n\n\nAI의 적용 방법 - 직접 모델 학습하기\n0:16:25\n\n\nAI 모델 서비스하기 - API\n0:10:31\n\n\nA 러닝의 개념을 이해할 수 있다\n인공지능이 분야별 적용 방법과 사례를 이해할 수 있다\n인공지능의 최근 동향 및 쟁점에 대한 이해할 수 있다", "target": "인공지능에 대한 관심이 있는 직장인", "curriculum": "인공지능이란?\n0:31:43\n\n\n머신러닝\n0:25:27\n\n\n컴퓨터 비전 모델 돌려보기\n0:16:07\n\n\n자연어 처리 모델 돌려보기\n0:23:43\n\n\n인공지능의 최근 동향\n0:18:23\n\n\n트랜스포머와 전이 학습\n0:20:57\n\n\n인공지능과 창의성\n0:23:02\n\n\n데이터의 숨겨진 패턴 찾기\n0:19:32\n\n\n강화학습\n0:22:50\n\n\n인공지능의 미래\n0:15:14\n\n\n인공지능의 한계\n0:18:24"}, {"cat1": "AI", "cat2": "", "title": "두근두근 인공지능 - 실습편 -", "duration": "3:41:42", "contents": "11", "instructor": "유재명", "summary": "인공지능, 나도 한번 만들어 보고 싶지 않나요?\n자율주행차, 챗봇, AI스피커등 우리 현실 속 많은 인공지능제품들\n어떤 원리로 작동하고, 어떻게 만들수 있는지 궁금하지 않으셨나요?\n노코드와 로우코드로 따라하다보면 쉽게 인공지능을 만들어 볼 수 있습니다.", "goal": "인공지능 개발을 위한 머신러닝의 절차를 이해한다\n머신러닝의 각 단계를 간단히 수행할 수 있다", "target": "인공지능을 직접 만들어보고 싶은 직장인", "curriculum": "머신러닝, 어떻게 학습시키는가?\n0:22:48\n\n\n머신러닝 개발 방법 비교\n0:18:54\n\n\n티처블 머신\n0:19:45\n\n\n프로그래밍 실습을 위한 세팅\n0:14:38\n\n\n머신러닝 프로그래밍\n0:26:59\n\n\n티처블 머신 모델 불러오기\n0:26:26\n\n\n컴퓨터 비전 모델 돌려보기\n0:12:26\n\n\n미세조정\n0:16:54\n\n\n자연어 처리 모델 돌려보기\n0:16:01\n\n\nAutoML\n0:28:30\n\n\n머신러닝 성능 평가\n0:18:21"}, {"cat1": "AI", "cat2": "", "title": "리더를 위한 생성형 AI 비즈니스 전략", "duration": "2:29:40", "contents": "6", "instructor": "김진", "summary": "미래를 이끄는 리더의 필수 선택, 생성형 AI 비즈니스 전략 교육\n\nAI의 잠재력을 전략적으로 활용하여, 조직을 다음 단계로 도약시키는 방법을 모색해보자!\n\n본 과정을 통해 리더들이 비즈니스 현장에서 필수 역량이 된 생성형 인공지능을 업무와 사업에 제대로 활용할 수 있을 것이다.", "goal": "- 생성형 인공지능 도구를 활용한 다양한 방법을 습득할 수 있다.\n- AI와의 상호작용을 최적화하는 프롬프트 엔지니어링 기법을 배워, 생산성을 극대화할 수 있다.\n- AI를 활용한 비즈니스 전략을 이해하고, 이를 통해 혁신적인 비즈니스 환경을 구축할 수 있다.", "target": "- AI 기술을 활용해 생산성을 높이고자 하는 모든 직장인 및 경영인\n- 최신 AI 기술을 업무에 적용하고 싶은 IT 전문가\n- 프롬프트 엔지니어링 기법을 배우고 싶은 데이터 분석가\n- AI 비즈니스 전략을 이해하고 적용하고 싶은 경영자와 기획자", "curriculum": "생성형 AI는 증강 역량 도구\n0:33:35\n\n\n주목해야 할 생성형 인공지능 서비스\n0:16:30\n\n\n프롬프트 엔지니어링 전략\n0:17:26\n\n\n생성형 AI, 비즈니스에 어떻게 적용할까?\n0:27:39\n\n\n생성형 AI 생태계의 이해\n0:17:54\n\n\n주요 생성형 AI 비즈니스 적용 실습\n0:36:36"}, {"cat1": "AI", "cat2": "", "title": "생성형 AI 완전정복! 업무 효율화부터 보안윤리까지", "duration": "3:04:35", "contents": "6", "instructor": "김덕진", "summary": "AX 시대 생존을 위한 필수 전략을 알려 드립니다!", "goal": "1. 단순 AI에 대한 소개가 아닌 AGI, 인터페이스의 변화 등 AI의 미래와 해외 기업의 AI 적용 사례를 통한 인사이트를 제공할 수 있습니다.\n2. 직장인들이 AI를 업무에 효과적으로 활용할 수 있도록 실무 중심의 적용방법을 학습할 수 있습니다.\n3. AI 활용 과정에서 반드시 고려해야 할 윤리적 이슈도 함께 다뤄 균형 잡힌 관점을 제공할 수 있습니다.", "target": "- 생성형AI를 똑똑하게 활용하고 싶은 모든 직장인", "curriculum": "AI의 미래: AGI, 에이전트, 인프라\n0:33:13\n\n\nAI로 똑똑하게 실무하기\n0:26:32\n\n\nAI 똑똑하게 활용하기\n0:31:28\n\n\n일잘러를 위한 AI 도구들\n0:33:30\n\n\nAX시대의 빛과 그림자\n0:33:32\n\n\nAX시대 직장인의 자세\n0:26:20"}, {"cat1": "AI", "cat2": "", "title": "업무시간을 절반으로, ChatGPT로 시작하는 데이터 리터러시(1)", "duration": "2:48:25", "contents": "10", "instructor": "구자룡", "summary": "생성형 AI 도구를 활용한 노코드 데이터 분석을 주제로 합니다. ChatGPT, Gemini, Claude, Perplexity, Julius 등의 AI 도구를 사용하여 데이터 수집, 분석, 시각화, 보고서 작성 등 데이터 분석의 모든 단계를 수행합니다.", "goal": "- 다양한 데이터 분석 기법을 습득하고 실습을 통해 실제 비즈니스 상황에서의 적용 능력을 향상시킵니다.\n- AI를 활용한 데이터 분석 결과를 해석하고 이를 기반으로 전략적 의사결정을 내릴 수 있는 능력을 기릅니다.\n- 코드 작성 없이도 데이터 수집, 클리닝, 분석, 시각화까지 모든 데이터 분석 과정을 AI 도구로 수행하는 기술을 익힙니다.\n- 시장 조사, 설문지 작성, 데이터 수집, 가설 검정, 상관관계 및 인과관계 분석, 텍스트 데이터 분석 등 다양한 데이터 분석 도구와 기법을 효과적으로 활용할 수 있는 능력을 기릅니다.", "target": "- 마케팅 전략을 세우고 시장 조사가 필요한 학습자\n- 기존에 복잡한 데이터 분석 도구없이 보다 빠르고 간편하게 데이터를 분석하고 싶은 학습자\n- 빠르고 효율적으로 데이터를 분석하여 의사결정을 하고 싶은 학습자", "curriculum": "데이터 리터러시 및 데이터 분석에 대한 기초개념 이해\n0:16:56\n\n\n데이터 분석 도구와 ChatGPT 실습\n0:20:53\n\n\n시장조사를 통한 데이터 수집 방법 이해\n0:15:24\n\n\nChatGPT를 이용한 시장조사 방법과 질문지만들기 실습\n0:19:06\n\n\n데이터를 수집과 방법이해\n0:13:33\n\n\nChatGPT를 이용한 데이터 클리닝하기 실습\n0:15:06\n\n\n탐색적, 확증적 데이터 분석의 차이와 데이터 특성 이해\n0:20:36\n\n\nChatGPT를 이용한 탐색적 데이터 분석 실습\n0:12:03\n\n\n통계적 가설 검정, A/B테스트 설계이해\n0:17:43\n\n\nChatGPT를 이용한 가설 검정, A/B 테스트 실습\n0:17:05"}, {"cat1": "AI", "cat2": "", "title": "업무시간을 절반으로, ChatGPT로 시작하는 데이터 리터러시(2)", "duration": "2:36:09", "contents": "10", "instructor": "구자룡", "summary": "생성형 AI 도구를 활용한 노코드 데이터 분석을 주제로 합니다. ChatGPT, Gemini, Claude, Perplexity, Julius 등의 AI 도구를 사용하여 데이터 수집, 분석, 시각화, 보고서 작성 등 데이터 분석의 모든 단계를 수행합니다.", "goal": "- 다양한 데이터 분석 기법을 습득하고 실습을 통해 실제 비즈니스 상황에서의 적용 능력을 향상시킵니다.\n- AI를 활용한 데이터 분석 결과를 해석하고 이를 기반으로 전략적 의사결정을 내릴 수 있는 능력을 기릅니다.\n- 코드 작성 없이도 데이터 수집, 클리닝, 분석, 시각화까지 모든 데이터 분석 과정을 AI 도구로 수행하는 기술을 익힙니다.\n- 시장 조사, 설문지 작성, 데이터 수집, 가설 검정, 상관관계 및 인과관계 분석, 텍스트 데이터 분석 등 다양한 데이터 분석 도구와 기법을 효과적으로 활용할 수 있는 능력을 기릅니다.", "target": "- 마케팅 전략을 세우고 시장 조사가 필요한 학습자\n- 기존에 복잡한 데이터 분석 도구없이 보다 빠르고 간편하게 데이터를 분석하고 싶은 학습자\n- 빠르고 효율적으로 데이터를 분석하여 의사결정을 하고 싶은 학습자", "curriculum": "데이터의 상관관계 및 연관성 이해\n0:14:16\n\n\nChatGPT를 이용한 상관분석 및 가설 검정 실습\n0:15:28\n\n\n변수의 인과관계 및 예측분석 이해\n0:13:23\n\n\nChatGPT를 이용한 회귀 분석 실습\n0:19:27\n\n\n타겟 마케팅을 위한 고객 세분화의 이해\n0:15:47\n\n\nChatGPT를 이용한 군집분석 실습\n0:12:00\n\n\n텍스트 데이터 분석과 분석 방법의 이해\n0:13:25\n\n\n생성형 AI 도구를 활용한 노코드 데이터 분석을 주제로 합니다.\n\n챗GPT를 이용한 텍스트 데이터 전처리 실습\n0:19:00\n\n\n데이터의 종류와 시각화 목적에 따른 차트 유형 이해\n0:18:44\n\n\nChatGPT를 이용한 시각화 분석 도출 및 보고서 작성 실습\n0:14:39"}, {"cat1": "AI", "cat2": "", "title": "업무에 따라 골라 쓰는 생성형 AI 실전 매뉴얼", "duration": "4:00:03", "contents": "10", "instructor": "신성진", "summary": "업무에 따라 골라 쓰는 생성형 AI. 실전 활용법으로 업무 효율화 극대화하기!", "goal": "- 생성형 AI의 원리와 주요 도구의 특징을 설명할 수 있다.\n- 엑셀, 문서, 보고서 등 실무에 AI를 적용하는 방법을 알 수 있다.\n- 프롬프트 설계와 업무 자동화를 실천하고 AI 도입 시 유의점과 조직 내 활용 전략을 설명할 수 있다.", "target": "- 업무에 생성형 AI를 활용하고자 하는 모든 직장인\n- LLM, 생성형 AI의 실전 활용을 단기간에 이해하고 싶은 직장인\n- 조직의 업무 생산성 혁신을 고민하는 팀 리더와 관리자", "curriculum": "AI 트렌드를 놓치지 않기 위한 필수 즐겨찾기 사이트\n0:13:47\n\n\n한 번에 딱 이해하는 LLM 진화 과정\n0:23:39\n\n\n비즈니스 문서를 빠르게 만드는 5가지 노하우\n0:19:57\n\n\n실전! AI 딥리서치 도구 활용\n0:16:41\n\n\n실전! 멀티모달 AI 활용\n0:13:00\n\n\n파일부터 손글씨까지, 문서 요약하기\n0:22:33\n\n\n이미지와 영상을 만드는 프롬프팅 노하우\n0:38:35\n\n\n1분이면 충분! AI로 웹 크롤링하기\n0:27:09\n\n\nLLM으로 완성하는 엑셀, 데이터 분석\n0:40:29\n\n\n발표자료와 랜딩페이지를 자동화하는 생성형 AI 활용법\n0:24:13"}, {"cat1": "AI", "cat2": "", "title": "왕초보를 위한 ChatGPT로 배우는 파이썬", "duration": "4:46:49", "contents": "10", "instructor": "윤근식", "summary": "디지털 시대, 왜 직장인에게 코딩 리터러시가 필요할까요?\n\nChatGPT와 같은 생성형 AI가 업무 방식을 혁신하고 있는 지금, 코딩 리터러시(Coding Literacy)는 더 이상 개발자만의 전유물이 아닙니다. \n모든 직장인에게 중요한 경쟁력으로 자리 잡고 있습니다. 코딩 리터러시는 단순히 프로그램을 개발하는 능력을 의미하지 않습니다. 데이터와 시스템이 어떻게 작동하는지 이해하고, 문제를 논리적으로 해결하며, 자동화된 솔루션을 활용하는 사고 방식을 포함합니다.", "goal": "- AI 시대, 컴퓨터와 사람의 상호작용을 이해하고, 컴퓨터와 직접 소통할 수 있는 도구인 코딩과 이를 읽는 능력을 향상시킬 수 있습니다.\n- ChatGPT에게 받는 맞춤형 가이드(단계별 프롬프트와 예제)를 통해 쉽게 따라할 수 있으며, 구체적인 질문과 내용 설명으로 파이썬을 학습할 수 있습니다.\n- 학습 내용을 바탕으로 간단한 프로그램을 만들어 볼 수 있도록 구성할 수 있습니다.", "target": "- 나이나 배경에 관계없이 프로그래밍을 처음 배우고 싶은 성인학습자\n- 챗GPT와 같은 AI 도구를 활용해 새로운 기술을 배우고자 하는 사람\n- 업무 자동화, 데이터 분석 등 실질적인 목적으로 파이썬을 배우고자 하는 일반인", "curriculum": "코딩 리터리시와 코딩 문맹\n0:19:12\n\n\n코딩 문맹 탈출을 위한 세 가지 도구\n0:32:28\n\n\n변수와 자료형, 연산자\n0:34:59\n\n\n컬렉션 자료형(리스트,튜플,사전,집합)\n0:25:58\n\n\n조건문(if문)\n0:24:17\n\n\n반복문(for문,while문)\n0:32:06\n\n\n함수\n0:28:02\n\n\n클래스(Class)와 객체(Object)\n0:29:34\n\n\n파일 읽고 쓰기\n0:27:31\n\n\n프로젝트 및 정리\n0:32:42"}, {"cat1": "AI", "cat2": "", "title": "움직이는 지능, 피지컬 AI 시대", "duration": "2:54:33", "contents": "8", "instructor": "박종성", "summary": "피지컬 AI는 더 이상 스크린 속에서만 작동하는 인공지능이 아니라, 로봇·자율주행차·드론처럼 ‘몸’을 얻어 현실을 감지하고 판단하며 직접 움직이는 AI로 빠르게 확장되고 있습니다. 제조 현장의 휴머노이드 로봇, 도로 위 완전 자율주행, 정밀 농업 드론 사례를 통해 피지컬 AI가 산업과 일상을 어떻게 바꾸고 있는지 살펴보고, 감지–인식–행동의 작동 원리와 디지털 트윈·강화학습 기반 학습 방식, 그리고 체화된 데이터가 만들어내는 새로운 경쟁 구도까지 이해해봅니다. 이를 통해 피지컬 AI 시대의 핵심 개념과 흐름을 한 번에 정리하고, 앞으로 우리가 준비해야 할 변화의 방향을 함께 탐색해보겠습니다.\n피지컬 AI의 개념부터 미래까지 연결하는 흐름 중심 구성\n스크린 속 AI를 넘어 현실로 확장된 피지컬 AI의 등장 배경부터 작동 원리, 산업 적용, 미래 변화까지를 하나의 흐름으로 정리하여, 기술의 맥락을 단계적으로 이해할 수 있도록 구성\n기술 설명을 넘어 산업·노동·국가 경쟁까지 확장한 관점 제시\n개별 기술에 국한되지 않고, 산업 현장과 인간의 노동 변화, 글로벌 기술 경쟁과 국가 전략까지 함께 다루어 피지컬 AI가 만들어내는 구조적 변화를 종합적으로 조망\n사례와 개념을 통해 피지컬 AI 시대의 핵심 질문을 제시하는 과정\n로봇·자율주행·제조 현장 사례를 통해 ‘왜 피지컬 AI가 중요한가’, ‘우리는 무엇을 준비해야 하는가’라는 질문을 자연스럽게 연결하며 이해  중심의 학습 경험 제공", "goal": "- 피지컬 AI의 핵심 개념과 작동 원리를 이해하고 파악할 수 있다.\n- 산업·기업·기술 구조를 통해 글로벌 트렌드를 설명할 수 있다.\n- 체화된 데이터(Embodied Data)의 중요성을 이해하고 활용 방향을 탐색할 수 있다.", "target": "- 제조업, IT, R&D, 기술기획 직무 종사자\n- AI·로봇·자동화 분야 기초 지식이 필요한 일반 직장인\n- 피지컬 AI의 기술·산업·정책 동향을 한눈에 파악하려는 실무자", "curriculum": "스크린 밖으로 걸어 나온 인공지능 : 피지컬 AI의 시대\n0:25:12\n\n\n피지컬 AI의 작동원리 - 감지·인식·행동의 3단계\n0:26:26\n\n\n데이터의 진화 - ‘체화된 데이터’가 바꾸는 세상\n0:22:13\n\n\n산업 현장에서 I의 개념과 원리를 좀 더 쉽게 이해하고 파악할 수 있다. \n- AI의 변화에 개인과 기업의 대응방법을 설명할 수 있다.", "target": "- 기업체 전 임직원\n- 스마트한 업무 역량 향상을 위해 생성형 AI의 필요성을 느끼는 직장인", "curriculum": "생성형 AI란? 개념부터 역사까지\n0:18:54\n\n\n생성형 AI 요소의 핵심기술 탐구\n0:24:47\n\n\n생성형 AI 서비스의 다양한 모습들\n0:14:17\n\n\n프롬프트 엔지니어링: 원하는 답을 끌어내는 기술\n0:16:06\n\n\n생성형 AI, 산업을 혁신하다: 산업 적용 사례\n0:22:05\n\n\n생성형 AI의 Collaborative IT: 함께 일하는 법\n0:26:27\n\n\n생성형 AI의 비즈니스 생태계: 새로운 기회와 도전, 전투 그리고 상생\n0:48:18\n\n\n생성형 AI, 철학에 답하다: 인지과학과 철학 관점의 고찰\n0:15:26\n\n\n생성형 AI의 그림자: 오남용 문제와 사회적 책임\n0:21:16\n\n\nAI시대를 맞이하기 위한 바람직한 태도\n0:12:13"}, {"cat1": "AI", "cat2": "", "title": "직무별 AI 대응 전략 - 내 일자리 진단부터 스킬업까지", "duration": "2:44:30", "contents": "8", "instructor": "이시한", "summary": "내 일의 미래를 진단하고, AI와 함께 성장하는 법을 배운다.\n기술은 빠르게 진화하고, 산업 구조와 직무는 그보다 더 빠르게 바뀝니다.\n지금 필요한 것은 내 일의 미래를 읽는 힘. AI 트렌드를 이해하고, 변화를 주도하는 사람만이 생존합니다.\n이 과정은 산업 재편과 기술 전환 흐름 속에서 지금, 나의 일에 어떤 변화가 오는지, 그리고 어떻게 대비할 수 있는지를 직무 관점에서 구체적으로 알려드립니다.", "goal": "AI 기반 산업 재편 흐름과 기술 트렌드를 이해하고 직무별 변화 양상과 대응 전략을 파악할 수 있다.", "target": "변화에 대응해야 하는 전 직군 실무자", "curriculum": "AI 시대, 왜 지금 변화를 읽어야 하는가?\n0:23:32\n\n\nAI의 미래를 알기 위해서는 국가가 아닌 기업의 방향을 읽어야 한다\n0:23:18\n\n\nAI로 송두리째 바뀌는 산업과 미래\n0:17:49\n\n\nAI가 대체하는 업무역량, 강화되는 업무역량은?\n0:15:47\n\n\n직무별 AI 트렌드, 당신의 일도 예외는 아니다\n0:23:33\n\n\n조직에 AI를 도입하기 위한 AI Transfomation, 이젠 실전이다\n0:20:09\n\n\n생성형 AI와 미래 기술, 어떻게 일에 접목할 것인가?\n0:19:48\n\n\nAI 시대, 일 잘하는 사람으로 살아남기\n0:20:34\n\n\n과정 정보\n강사 정보\n과정 요약\n내 일의 미래를 진단하고, AI와 함께 성장하는 법을 배운다. 기술은 빠르게 진화하고, 산업 구조와 직무는 그보다 더 빠르게 바뀝니다. 지금 필요한 것은 내 일의 미래를 읽는 힘. AI 트렌드를 이해하고, 변화를 주도하는 사람만이 생존합니다. 이 과정은 산업 재편과 기술 전환 흐름 속에서 지금, 나의 일에 어떤 변화가 오는지, 그리고 어떻게 대비할 수 있는지를 직무 관점에서 구체적으로 알려드립니다.\n\n\nAI 대전환 시대, 직무의 미래를 체계적으로 진단산업과 업무의 변화 방향, 직무별 자동화 가능성 등 구체적인 분석을 통해 개인 맞춤형 AI 대응 전략 수립이 가능AI 실무 적용 사례 중심 구성단순한 개념 설명을 넘어서 실제 기업과 산업에서 적용된 AI 사례와 기술 트렌드를 통해 실전 대응력을 높임이시한 저자의 『AI 패권전쟁』 기반 명확한 관점 제공도서를 기반으로 작성된 커리큘럼으로, AI 시대의 생존 전략을 명확한 시각과 함께 이해할 수 있도록 도움\n\n학습대상\n변화에 대응해야 하는 전 직군 실무자"}, {"cat1": "AI", "cat2": "", "title": "직무별 맞춤 ChatGPT 활용법: AI로 업무 혁신하기", "duration": "1:18:28", "contents": "7", "instructor": "박기삼", "summary": "\"AI로 일의 혁신을 시작하다!\" 반복 업무 자동화, 콘텐츠 제작, 데이터 정리 등 다양한 직무에서 바로 적용 가능한 AI 스킬을 배우세요!", "goal": "- 직무에 적합한 ChatGPT 활용 방법을 이해하고 실무에 바로 적용할 수 있다.  \n- 반복적인 업무를 자동화하여 효율성을 높이고 시간 관리를 최적화할 수 있다.  \n- ChatGPT를 활용해 마케팅, 인사, 고객 서비스 등 다양한 분야에서 성과를 향상시킬 수 있다.  \n- ChatGPT를 활용한 커리어 개발과 자기소개서 작성법으로 취업 경쟁력을 강화할 수 있다.", "target": "- AI를 활용해 업무 효율성을 높이고 싶은 직장인\n- 마케팅, 인사, CS, R&D, 경영지원 등의 실무에 ChatGPT를 적용하고 싶은 전문가\n- AI를 활용한 취업 및 커리어 개발에 관심 있는 취준생 및 경력 개발자 \n- 업무 자동화와 데이터 관리로 시간을 절약하고 싶은 모든 직무 담당자", "curriculum": "업무 자동화의 시작, 맞춤형 GPT로 나만의 AI 챗봇 만들기\n0:15:00\n\n\n취업과 커리어 개발 - ChatGPT로 돋보이는 자기소개서 작성법\n0:09:32\n\n\n마케팅 담당자를 위한 ChatGPT 활용법 - 광고 카피, 블로그, SNS 콘텐츠 제작\n0:13:24\n\n\n인사 담당자를 위한 ChatGPT 활용법 - 직원 FAQ 챗봇으로 간편한 정보 제공\n0:10:10\n\n\nCS 담당자를 위한 ChatGPT 활용법 - 고객 대응 매뉴얼부터 FAQ 생성까지\n0:08:27\n\n\nR&D 업무 담당자를 위한 ChatGPT 활용법 - 논문 검색\n0:13:29\n\n\n경영지원 담당자를 위한 ChatGPT 활용법 - 영수증 정리 등 GPT를 활용한 업무 자동화\n0:08:26"}, {"cat1": "AI", "cat2": "", "title": "직장인을 위한 ChatGPT 실무 활용법", "duration": "1:50:31", "contents": "15", "instructor": "박기삼/임재훈", "summary": "이 과정은 ChatGPT의 다양한 실무 활용 방법을 통해 직장인들이 ChatGPT를 통해 업무 효율성을 높일 수 있으며, ChatGPT를 통해 보고서 작성, 이메일 처리, 번역 및 데이터 분석 등 다양한 업무에서 ChatGPT를 활용할 수 있도록 돕습니다.", "goal": "- ChatGPT의 주요 기능과 개념을 이해하고 이를 실무에 적용할 수 있다.\n- 보고서, 이메일, 번역 등 다양한 업무에서 ChatGPT를 활용해 효율성을 높인다.\n- 데이터 분석 및 자동화 작업에 ChatGPT를 적용하여 업무 생산성을 극대화한다.", "target": "- ChatGPT를 업무에 적용하고 싶은 직장인\n- 인공지능 도구를 활용해 문서 작성, 데이터 처리 등의 업무 시간을 절감하고자 하는 실무자", "curriculum": "ChatGPT를 배워야 하는 이유\n0:04:08\n\n\n생성형 AI와 언어모델\n0:04:36\n\n\n언어모델과 인공지능의 원리\n0:05:09\n\n\n왜 ChatGPT는 특별할까\n0:04:16\n\n\nChatGPT 시작하기\n0:04:01\n\n\nChatGPT 무료 vs 유료\n0:05:39\n\n\nChatGPT 주요 기능 - 웹 검색하기\n0:05:32\n\n\nChatGPT 주요 기능 - 이미지 생성하기\n0:04:07\n\n\nChatGPT 주요 기능 - 코드 인터프리터\n0:09:21\n\n\nChatGPT와 보고서 작성하기 1 - 일일 및 주간 업무 보고서 작성\n0:13:43\n\n\nChatGPT와 보고서 작성하기 2 - 파일 업로드를 통한 보고서 작성\n0:11:13\n\n\nChatGPT와 이메일 작성하기 1 - 제안, 거절, 고객 컴플레인 대응하기\n0:05:54\n\n\nChatGPT와 이메일 작성하기 2 - 상황별 템플릿, 스레드 요약, 초안 이어쓰기, 영문 이메일\n0:05:50\n\n\nChatGPT로 번역 및 요약하기 - 맥락 이용 번역, 데이터 분할 후 요약, STT 기반 회의록 작성, 영상 스크립트 요약\n0:11:54\n\n\nChatGPT와 기획서/제안서 작성하기 - 시장조사, 아이디어 도출, 초안 작성, PPT 기획\n0:15:08"}, {"cat1": "AI", "cat2": "", "title": "처음 배우는 딥러닝(Deep Learning)", "duration": "3:34:22", "contents": "10", "instructor": "노태상", "summary": "AI, 머신러닝, 딥러닝의 주요 개념과 구조 이해하고 딥러닝의 활용방법을 학습한다.", "goal": "- AI, 머신러닝, 딥러닝 주요 개념과 구조 이해할 수 있다.\n- 딥러닝의 활용 사례 학습을 통해서 현업에 활용할 수 있다.", "target": "- 소프트웨어개발자\n- 시스템 엔지니어 등", "curriculum": "인공지능(AI)\n0:23:59\n\n\nMachine Learning Algorithm\n0:23:19\n\n\nNeural Network Architecture\n0:19:02\n\n\nDeepLearning Framework\n0:22:26\n\n\nMulti Layer Perceptron\n0:24:25\n\n\nConvolution Neural Network\n0:21:51\n\n\nCNN을 통한 이미지 분류\n0:20:48\n\n\nRecurrent Neural Network(RNN)\n0:17:16\n\n\nGenerative Adversarial Network(GAN)\n0:20:54\n\n\n강화학습(Reinforcement Learning)\n0:20:22"}, {"cat1": "AI", "cat2": "", "title": "처음 배우는 머신러닝(Machine Learning)", "duration": "3:55:45", "contents": "8", "instructor": "양진호", "summary": "머신러닝 초급자와 중급자를 위해서 자세한 개념과 실제 프로그램 코드를 통한 학습을 알아보자!", "goal": "1. AI, 머신러닝, 딥러닝 주요 개념과 구조를 이해하여 설명할 수 있다.\n2. 머신러닝의 활용 사례 학습을 통해서 현업에 활용할 수 있다.", "target": "- S/W 개발자\n- 시스템 엔지니어 등", "curriculum": "머신러닝 기초 개념 & Google Colab 소개\n0:37:33\n\n\n머신러닝을 위한 넘파이(Numpy) & 판다스(Pandas)\n0:40:40\n\n\nscikit-learn 기초\n0:27:30\n\n\n분류(Classification)와 회귀(Regression)\n0:31:26\n\n\nKaggle 소개 & 타이타닉 생존자 예측해보기\n0:26:21\n\n\nRegression을 위한 알고리즘\n0:26:56\n\n\nClassification을 위한 알고리즘\n0:23:40\n\n\n머신러닝 성능 향상을 위한 기법들\n0:21:39"}, {"cat1": "AI", "cat2": "", "title": "처음 시작하는 MS Copilot, 나만의 업무 파트너 만들기", "duration": "5:52:26", "contents": "12", "instructor": "김진", "summary": "365일 쓰는 MS 오피스에 인공지능 비서가 온다! 생산성을 극대화할 새로운 도우미 Copilot\n\nChatGPT 등 생성형 AI 도구의 보급으로 개인의 편의성은 높아졌지만 아직 조직 전체의 생산성 향상이라는 결과로 이어지지는 못한 상황, 진정한 업무 변화의 두 번째 물결은 MS Copilot으로부터 시작된다!\n\n본 과정에서는 문서 작성, 디자인, 메일 자동 답변, 회의 자동 요약과 데이터 분석까지 다양한 업무 상황에서 MS Copilot을 활용하는 방법을 안내한다.", "goal": "- MS Copilo title": "평범한 직장인도 5분만에 만드는 AI 콘텐츠", "duration": "2:12:55", "contents": "8", "instructor": "김경찬", "summary": "생성형 AI 시대 직장인이 갖추어야 할 콘텐츠 생성 실무 역량 중심 구성 AI 시대, 창의적 콘텐츠 제작은 직장인에게 경쟁력이 되고 있습니다. 본 과정은 AI를 활용한 업무 효율성과 경쟁력을 동시에 높이는 실질적이고 실무적인 강의를 제공합니다. 10년차 직장인이자 사내 AI 활용 강의를 하고 있는 강사를 통해 이론이 아닌 일반 직장인도 실제 활용가능한 기능 위주로 학습을 진행합니다.", "goal": "1. 미드저니, 런웨이 젠쓰리 등 생성형 AI를 통해 누구든 쉽게 원하는 이미지, 영상을 만들 수 있습니다.  \n2. 현 직장인 디자이너가 직접 알려주는 기능 세팅, 프롬프트, 유의사항, 활용 팁을 통해 교육영상 한편이 끝날 때마다 해당 기능을 바로 활용할 수 있습니다.", "target": "- 기술을 활용하여 실무에 필요한 콘텐츠를 직접 제작하고자 하는 직장인\n- 미드저니와 같은 생성형 AI 도구를 활용해 브랜드 이미지, 광고 콘텐츠, 영상 등을 효율적으로 제작하려는 디자이너나 마케터\n- 조직 내 AI 도입 가능성을 탐색하고, 팀의 생산성과 창의성을 높이기 위해 AI 기반 콘텐츠 제작 방법을 배우고자 하는 관리자", "curriculum": "콘텐츠 제작을 위한 생성형 AI 알아보기\n0:11:45\n\n\n미드저니 설치와 UI 세팅하기\n0:13:05\n\n\n미드저니 파라미터\n0:13:48\n\n\n미드저니로 나만의 인물 생성하기\n0:10:49\n\n\n미드저니로 다양한 장르와 스타일 만들기\n0:28:46\n\n\n생성한 이미지로 동영상 만들기\n0:27:10\n\n\n이미지생성 Tip, 업스케일/아바타 만들기\n0:09:29\n\n\n업무활용 Tip, 카드뉴스/홍보영상 만들기\n0:18:03"}, {"cat1": "AI", "cat2": "", "title": "프롬프트에 대한 이해와 ChatGPT 주요 기능 활용법", "duration": "1:23:12", "contents": "7", "instructor": "박기삼/임재훈", "summary": "프롬프트 엔지니어링부터 문서 작성 및 분석까지, AI 도구를 이용한 실무 능력을 극대화할 수 있습니다.", "goal": "- 프롬프트 엔지니어링을 익혀 ChatGPT와 효과적으로 소통할 수 있다.", "target": "- ChatGPT를 업무에 적용하고 싶은 직장인\n- 프롬프트 엔지니어링을 배우고 이를 다양한 업무에 적용하고자 하는 관리자 및 실무자", "curriculum": "프롬프트 엔지니어링이란\n0:08:21\n\n\n프롬프트 작성 기본 노하우\n0:06:15\n\n\n프롬프트 엔지니어링 실전 팁\n0:07:53\n\n\nChatGPT 기본 활용, 프롬프트 엔지니어링 적용하기\n0:35:41\n\n\nChatGPT 주요 기능 - 맞춤형 지침\n0:13:06\n\n\nChatGPT 주요 기능 - 메모리\n0:06:20\n\n\nChatGPT 활용 심화 - 컨텍스트 윈도우 이해하기\n0:05:36"}, {"cat1": "AI", "cat2": "", "title": "현직 AI 디자인 전문가가 알려주는 미드저니 클래스", "duration": "5:01:59", "contents": "10", "instructor": "양솔지", "summary": "이미지 생성형 인공지능의 대표 툴, Midjourney!\n기초 사용 방법부터 실제 디자인 프로젝트 실습을 통한 실무 적용까지 한번에!", "goal": "- 대표적인 이미지 생성 인공지능 도구인 미드저니에 대해 이해하고 입문할 수 있다.\n- 이미지 생성 방법과 미세 조정을 통해 원하는 이미지를 생성해내는 방법을 이해할 수 있다.\n- 다양한 대상에 맞게 여러 기능을 활용하여 적절한 이미지를 생성할 수 있다.\n- 실제 업무에서 활용 가능한 실무 디자인 이미지를 생성할 수 있다.", "target": "- 생성형 인공지능에 관심이 있는 누구나\n- 디자인 업무의 소요 시간과 비용을 획기적으로 단축하고 싶은 디자이너\n- 디자이너 채용으로 인한 비용과 외주 제작으로 인한 비용이 부담스러운 창업자\n- 높은 퀄리티의 이미지를 빠르게 생성하고 싶은 모든 실무자", "curriculum": "미드저니 시작하기\n0:29:26\n\n\n이미지 수정 및 세부 설정\n0:24:44\n\n\n프롬프트 팁 및 파라미터\n0:28:24\n\n\n인물/캐릭터 생성하기\n0:19:05\n\n\n일관적인 캐릭터 생성하기\n0:27:46\n\n\n이미지 참조하기\n0:35:48\n\n\n실무 활용 목업 디자인\n0:27:07\n\n\n독특한 스타일과 효과\n0:40:23\n\n\n다양한 캐릭터와 텍스트\n0:41:18\n\n\n실전 디자인 프로젝트\n0:27:58"}, {"cat1": "Biz. Skill", "cat2": "업무수행력", "title": "말해봐, ChatGPT가 다 해줄게. 대화·응대 전략", "duration": "1:06:57", "contents": "6", "instructor": "예지영", "summary": "본 과정은 감정 조율형 커뮤니케이션, 부정 표현 완화, 사내외 커뮤니케이션 전략, 고객 공감형 응대, 역할 기반 시뮬레이션 등 실무에서 자주 접하는 대화 상황을 중심으로 구성되어 있으며, ChatGPT를 활용해 효과적인 프롬프트를 설계하고 다양한 말하기 유형을 실습한다. 단순 표현 자동화가 아닌, 상황의 맥락을 고려한 전략적 표현력을 강화할 수 있도록 구성된 실전형 강의다.", "goal": "다양한 대화 상황에 맞는 어조와 표현을 프롬프트로 설계할 수 있다.\nGPT를 활용해 상황별 응대 및 보고 문장을 전략적으로 구성할 수 있다.\n반복 커뮤니케이션 업무를 자동화할 수 있는 템플릿 라이브러리를 구축할 수 있다.", "target": "고객응대, 사내 커뮤니케이션 등 정중하고 명확한 표현이 필요한 사무직 실무자\n보고서, 회신 메일 등 문서 기반 커뮤니케이션을 담당하는 관리자 및 실무 담당자\n반복되는 커뮤니케이션 업무를 AI를 활용해 효율화하고자 하는 직장인", "curriculum": "감정 조절형 커뮤니케이션 프롬프트 설계\n0:12:59\n\n\n부정적 메시지를 긍정적으로 바꾸는 훈련\n0:10:36\n\n\n사내 소통 유형별 GPT 활용 전략\n0:09:43\n\n\n고객 공감형 대화 표현 구성\n0:11:23\n\n\n커뮤니케이션 상황별 역할 기반 GPT 활용\n0:10:05\n\n\n개인 맞춤형 프롬프트 라이브러리 구축\n0:12:11"}, {"cat1": "Biz. Skill", "cat2": "업무수행력", "title": "말해봐, ChatGPT가 다 해줄게. 데이터 분석", "duration": "2:24:27", "contents": "7", "instructor": "고일화", "summary": "이 과정은 ChatGPT를 활용하여 수치형·텍스트형 데이터를 분석하고 이를 실무 보고서로 전환하는 실습 중심 교육이며 기본적인 데이터 구조화부터, 패턴 인사이트 도출, KPI 분석, 고객 피드백 자동 분류, 반복 보고서 자동화 템플릿 구축까지 포괄적으로 다루며, 데이터 해석과 문장 전환 능력을 함께 기를 수 있다. 데이터 시각화 힌트 제공과 함께, 팀/개인 맞춤형 템플릿 설계까지 병행하여 학습 효과를 극대화한다.", "goal": "수치 및 텍스트 데이터를 GPT에 맞는 구조로 정리하고 분석할 수 있다.\n데이터 기반 문장을 자동으로 생성하는 프롬프트를 설계할 수 있다.\n반복적인 보고서 업무를 자동화할 수 있는 템플릿을 구축할 수 있다.", "target": "데이터 해석과 보고서 작성을 동시에 효율화하고 싶은 일반 사무직 종사자\n고객 피드백, KPI, 설문 등 다양한 데이터를 다루는 기획/마케팅/영업 담당자\n반복적인 리포트 작성 업무를 자동화하고 싶은 관리자 및 팀 리더", "curriculum": "GPT에게 데이터를 주면 뽑아지는 힘 (도입 & 기본 실습)\n0:24:11\n\n\nGPT가 읽기 쉬운 데이터 구조 만들기\n0:25:03\n\n\n패턴을 데이터 인사이트로 바꾸기 + 시각화 힌트 도출\n0:24:25\n\n\n보고서를 말로 자동생성 : 표/수치 설명\n0:17:58\n\n\n고객 피드백/설문 자동 분석 (텍스트 데이터 다루기)\n0:16:18\n\n\nKPI 분석과 핵심 결과 요약 자동화\n0:17:16\n\n\n반복 업무 자동화 : 보고서 블록 & 프로젝트 정리\n0:19:16"}, {"cat1": "Biz. Skill", "cat2": "업무수행력", "title": "말해봐, ChatGPT가 다 해줄게. 스마트 업무 자동화", "duration": "1:45:17", "contents": "6", "instructor": "김애란", "summary": "이 과정은 ChatGPT 및 생성형 AI 도구를 활용하여 반복 문서 자동화, 보고서 요약, PPT 및 발표대본 생성, 회의록 정리, 스마트 리서치 등 다양한 실무 문서 작성 업무를 자동화하는 실전 중심의 교육으로 문서 유형별 자동화 전략부터 AI 기반 정보 수집 및 활용법까지, 실습과 사례 중심으로 구성되어 있어 학습자가 실제 업무에 바로 적용할 수 있도록 설계되어 있다.", "goal": "반복 문서 작성 및 정리에 필요한 프롬프트 작성 능력을 기른다.\n다양한 문서 유형(기획안, 회의록, 발표자료 등)에 생성형 AI를 적용할 수 있다.\n정보 수집부터 시각화까지 문서 작성 전 과정을 자동화할 수 있다.", "target": "반복적인 문서 업무를 효율적으로 자동화하고자 하는 일반 직장인\n팀 리더 및 관리자급으로 문서 보고와 회의가 잦은 실무자\n공공기관, 지자체, 기업의 문서 작성 및 보고 업무 담당자", "curriculum": "반복 문서(회의록, 공문, 주간보고 등) 유형 분석 및 자동화 템플릿 구조 이해\n0:13:10\n\n\n문서 작성 속도 3배 올리는 실전 활용법\n0:15:58\n\n\n심층보고서 작성부터 인포그래픽 시각화까지(Gemini)\n0:28:22\n\n\n발표자료(PPT) & 발표대본 자동 생성 실습(Gamma AI, ChatGPT)\n0:14:54\n\n\nAI로 회의 준비부터 회의록까지 자동화하기\n0:15:23\n\n\n내 문서로만 답하는 AI리서치 도우미(Notebook LM)\n0:17:30"}, {"cat1": "Biz. Skill", "cat2": "업무수행력", "title": "말해봐, ChatGPT가 다 해줄게. 실전 업무 활용", "duration": "1:43:04", "contents": "7", "instructor": "김금란", "summary": "본 과정은 ChatGPT를 기반으로 Napkin AI, Gamma AI, Felo AI, Imagen 3, Suno AI 등 다양한 생성형 AI 도구를 활용하여 실제 사무환경에서 필요한 콘텐츠를 자동 생성·활용하는 실전형 강의이다. 보고서 요약, 발표자료 구성, 이미지 생성, 음악 제작 등 멀티모달 콘텐츠 제작 역량을 중심으로 구성되어 있으며, 각 도구의 특성을 살린 업무별 적용사례 실습이 포함된다.", "goal": "다양한 생성형 AI 도구를 활용해 시각 콘텐츠 및 발표자료를 자동으로 제작할 수 있다.\n하나의 정보나 주제를 카드뉴스, PPT, 마인드맵 등 다양한 형식으로 변환할 수 있다.\n업무 목적에 맞는 이미지 및 음악 콘텐츠를 생성하고 실무에 적용할 수 있다.", "target": "보고서, 발표자료 등 콘텐츠 제작을 반복적으로 수행하는 실무자\n사내 커뮤니케이션, 홍보, 교육 콘텐츠 제작을 담당하는 기획·홍보 담당자\n생성형 AI를 실제 업무에 적용하고자 하는 전 직무의 사무직 종사자", "curriculum": "복잡한 보고서를 카드로 요약 정리하기 – Napkin AI\n0:17:04\n\n\n발표자료를 자동 구성하기 – Gamma AI\n0:15:36\n\n\n정보 구조를 한눈에 정리 – Felo AI 마인드맵 실습\n0:11:35\n\n\n문서를 발표자료로 자동 전환하고 편집하기 – Felo AI PPT 실습\n0:14:07\n\n\n발표자료용 시각 이미지를 직접 만들기 – Imagen 3 실습\n0:14:55\n\n\n영상·보고 콘텐츠용 음악 만들기 – Suno AI 실습\n0:12:38\n\n\n커스텀 모드 + ChatGPT 연동 – Suno AI 실습\n0:17:09"}, {"cat1": "Biz. Skill", "cat2": "업무수행력", "title": "말해봐, ChatGPT가 다 해줄게. 창의적 질문력", "duration": "1:25:01", "contents": "7", "instructor": "오수정", "summary": "본 과정은 ChatGPT를 활용해 실무에서 필요한 질문을 직접 설계하고, 이를 기반으로 아이디어 생성, 보고서 작성, 문제 해결까지 확장하는 질문력 중심의 교육이다. 좋은 질문을 만드는 법부터 팀 단위 워크숍, Why 기반 사고, 질문 템플릿 자동화까지 실습 중심으로 구성되어 있어, 직장인이 현장에서 바로 활용할 수 있는 질문 설계 및 사고력 향상 교육을 제공한다.", "goal": "다양한 실무 문서에 맞는 GPT 프롬프트 질문을 구조화할 수 있다.\n창의적 사고를 유도하는 질문을 통해 아이디어를 생성하고 확장할 수 있다.\n반복 업무에 질문 템플릿을 적용하여 업무 자동화 기반을 마련할 수 있다.", "target": "회의, 보고, 정책 제안 등 실무 문서에서 GPT를 적극 활용하고 싶은 직장인\n아이디어 회의, 브레인스토밍, 기획 업무 등 창의력을 요구받는 실무자\n질문력을 바탕으로 팀 커뮤니케이션과 문제 해결 능력을 향상시키고자 하는 관리자", "curriculum": "프롬프트 엔지니어링 소개와 맥락 (context)\n0:11:08\n\n\n프롬프트 엔지니어링 - 페르소나 (role prompt)\n0:12:19\n\n\n프롬프트 엔지니어링 - 예시 (few shot prompt)\n0:09:36\n\n\n프롬프트 엔지니어링 - 스텝 백 프롬프트 (Step-back prompt)\n0:09:31\n\n\n프롬프트 엔지니어링 - 샘플링 컨트롤 (sampling controls)\n0:15:42\n\n\nAI 에이전트란?\n0:13:06\n\n\nAI 에이전트 프롬프트 엔지니어링\n0:13:39"}, {"cat1": "IT", "cat2": "IT 기획", "title": "모두를 위한 AI 데이터 시각화 수업", "duration": "3:02:10", "contents": "6", "instructor": "최재원", "summary": "데이터 시각화는 단순히 예쁘게 보이는 그래프를 만드는 작업일까요? 아닙니다! 데이터 시각화는 예술이자 과학입니다. 과학적으로 정확하면서 미적으로 흉하지 않아야 하며, 또한 미적으로 탁월하면서도 과학적으로 오류를 용납하지 않는 결과물을 만들어야 합니다. 이 과정은 통계적 본질에 기반해 데이터를 과학적으로 정확하게, 동시에 시각적으로도 명확하게 전달하는 방법을 다룹니다.", "goal": "- 데이터를 명확하게 전달하는 색상 및 기호화 원칙을 이해하고, 실무 문서나 보고서에서 정보 전달력을 높일 수 있다.\n- 주요 시각화 유형과 그 특성을 파악하여, 직무 목적에 맞는 적절한 그래프를 선택하고 구성할 수 있다.\n- 좋은 그래프와 잘못된 예시를 비교 분석함으로써, 실무에서 신뢰성과 설득력을 갖춘 시각화 자료를 제작할 수 있다.", "target": "- 기업체 전 임직원\n- AI에 관심있는 학습자\n- 빅데이터와 데이터베이스에 관심있는 개발자 및 종사자", "curriculum": "데이터 시각화란 무엇인가?\n0:30:14\n\n\n데이터와 시각적 속성\n0:30:41\n\n\n시각적 속성과 인지과학적 원리\n0:26:51\n\n\n다양한 데이터 시각화 방식\n0:33:42\n\n\n그래프 디자인의 기본 원리\n0:29:23\n\n\n데이터 시각화의 응용\n0:31:19"}, {"cat1": "IT", "cat2": "데이터 분석", "title": "[AI 스킬링] 사회과학 연구 프로젝트를 위한  "데이터 분석", "title": "[DS Class] Excel 기반 데이터 시각화: 한눈에 읽히는 보고서 완성하기", "duration": "14:41:34", "contents": "17", "instructor": "최정아", "summary": "데이터 분석과 인사이트 도출은 완벽한데, 어떻게 보여줘야 상대가 바로 이해할 수 있을까?\nExcel과 AI를 활용해  데이터 메시지를 설득력 있게 전달해보자! \n\n본 과정은 데이터와 메시지를 보고서·프레젠테이션에서 설득력 있게 전달하는 데이터 시각화 과정이다. 시지각 원리, 차트 선택, 축과 눈금 설정, 레이아웃 설계를 통해 누가봐도 읽을 수 있는 데이터 시각화 구조를 알려준다. 또한 엑셀 기반 실습과 AI 도구를 활용해 차트, 인포그래픽, 인터랙티브 시각화 자료를 빠르게 제작하는 방법을 제공한다.", "goal": "1. 데이터 기반 커뮤니케이션의 맥락을 이해하고, 전달 목적에 맞는 핵심 메시지를 시각화할 수 있다.\n2. 데이터의 특성과 목적에 따라 적절한 차트 유형을 선택하고, 축·눈금·색상·레이아웃 등 시각화 요소를 효과적으로 설계할 수 있다.\n3. 엑셀과 AI 도구를 활용하여 보고서와 프레젠테이션에 적용 가능한 데이터 시각화 자료를 제작할 수 있다.", "target": "1. 보고서의 핵심 메시지를 명확하게 전달하고 싶은 직장인\n2. 자료의 가독성과 설득력을 높이는 데 어려움을 느끼는 직장인\n3. 데이터를 시각적으로 구조화하여 이해관계자의 의사결정을 돕고 싶은 직장인", "curriculum": "의사소통의 원리 - 쉐넌-위버 커뮤니케이션 모델과 라스트 마일 문제\n0:59:16\n\n\n데이터 메시지를 흐리는 의미적 잡음 줄이기\n0:55:28\n\n\n직관적인 데이터 시각화 - 전주의적 속성과 게슈탈트 원리\n0:52:53\n\n\n비즈니스 목적에 맞는 시각화 메시지 설계\n0:46:04\n\n\n의사결정에 필요한 핵심 사실 정리\n1:06:54\n\n\n가치 판단을 돕는 비교 기준 설계\n0:53:14\n\n\n상황 판단을 돕는 맥락 정보 설계\n0:50:40\n\n\n합리적 판단을 돕는 시뮬레이션 시각화\n0:36:11\n\n\n메시지 목적에 맞는 시각화 표현\n0:50:21\n\n\n상대방에 따라 달라지는 시각화 표현\n0:45:26\n\n\n시지각을 뒤흔드는 축과 눈금 설정\n1:21:20\n\n\n직관적으로 읽히는 정렬과 방향 설계\n0:47:59\n\n\n메시지 흐름을 만드는 정보 구조 설계\n0:45:18\n\n\n인지 부담을 줄이는 간결한 표현 원칙\n0:52:26\n\n\n복잡한 정보를 다루는 반응형 시각화\n0:40:37\n\n\n이해를 돕는 이미지와 시각 요소 활용\n0:41:59\n\n\nAI로 구현하는 인터랙티브/인포그래픽 시각화\n0:55:28"}, {"cat1": "IT", "cat2": "데이터 분석", "title": "ChatGpt로 끝내는 일잘러의 엑셀 자동화 실무 마스터", "duration": "6:25:27", "contents": "15", "instructor": "신성진", "summary": "이 과정은 엑셀과 생성형 AI(ChatGPT)의 시너지를 통해 데이터 집계, 정제, 시각화, 보고서 작성, 템플릿 자동화, 코드 없는 일정표 제작, VBA 자동화, 그리고 구글시트 연동까지 전 영역을 아우르는 실무 중심 교육으로 실습 위주로 구성되어 있어, 엑셀 초보자부터 중급자까지 단계적으로 학습하며 실무에 즉시 활용 가능한 역량을 키울 수 있도록 설계되었다.", "goal": "1. ChatGPT를 활용해 엑셀의 다양한 작업을 자동화하고 반복 업무를 줄일 수 있다.\n2. 데이터 집계·정제·분석을 AI와 연계하여 효과적으로 수행할 수 있다.\n3. VBA 없이 함수 중심으로 다양한 엑셀 업무 시스템을 구축할 수 있다.", "target": "1. 반복적인 엑셀 작업을 자동화하고 싶은 사무직 실무자 및 기획자\n2. 엑셀 데이터 기반으로 보고서나 분석자료를 효율적으로 만들고자 하는 직장인\n3. 코딩 const state = {
  cat1: new Set(),
  cat2: new Set(),
  search: '',
  sortKey: null,
  sortDir: 'asc',
  expanded: new Set()
};

function uniq(arr) { return [...new Set(arr)].filter(v => v && v.length); }

function buildChips() {
  // Build cat1 chips (with item counts)
  const cat1Counts = new Map();
  DATA.forEach(d => {
    if (!d.cat1) return;
    cat1Counts.set(d.cat1, (cat1Counts.get(d.cat1) || 0) + 1);
  });
  const cat1Vals = [...cat1Counts.entries()]
    .map(([v, n]) => ({ value: v, count: n }))
    .sort((a, b) => a.value.localeCompare(b.value, 'ko'));

  // Build cat2 chips (with item counts)
  const cat2Counts = new Map();
  DATA.forEach(d => {
    if (!d.cat2) return;
    cat2Counts.set(d.cat2, (cat2Counts.get(d.cat2) || 0) + 1);
  });
  const cat2Vals = [...cat2Counts.entries()]
    .map(([v, n]) => ({ value: v, count: n }))
    .sort((a, b) => a.value.localeCompare(b.value, 'ko'));

  renderCatChips('filter-cat1', cat1Vals, state.cat1, 'cat1');
  renderCatChips('filter-cat2', cat2Vals, state.cat2, 'cat2');
}

function renderCatChips(containerId, values, stateSet, kind) {
  const c = document.getElementById(containerId);
  c.innerHTML = '';
  values.forEach(p => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.dataset.value = p.value;
    chip.dataset.kind = kind;
    chip.innerHTML = escapeHtml(p.value) + ' <span class="chip-count">' + p.count + '</span>';
    chip.addEventListener('click', () => {
      if (chip.classList.contains('disabled')) return;
      if (stateSet.has(p.value)) stateSet.delete(p.value);
      else stateSet.add(p.value);
      chip.classList.toggle('active');
      updateCat2Dimming();
      render();
    });
    c.appendChild(chip);
  });
}

// Dim cat2 chips that have no items under currently selected cat1 (and vice versa)
function updateCat2Dimming() {
  document.querySelectorAll('#filter-cat2 .chip').forEach(chip => {
    const v = chip.dataset.value;
    if (state.cat1.size === 0) {
      chip.classList.remove('disabled');
      return;
    }
    const hasMatch = DATA.some(d => state.cat1.has(d.cat1) && d.cat2 === v);
    if (hasMatch) chip.classList.remove('disabled');
    else {
      chip.classList.add('disabled');
      // Also unselect it if it was selected
      if (state.cat2.has(v)) {
        state.cat2.delete(v);
        chip.classList.remove('active');
      }
    }
  });
  document.querySelectorAll('#filter-cat1 .chip').forEach(chip => {
    const v = chip.dataset.value;
    if (state.cat2.size === 0) {
      chip.classList.remove('disabled');
      return;
    }
    const hasMatch = DATA.some(d => state.cat2.has(d.cat2) && d.cat1 === v);
    if (hasMatch) chip.classList.remove('disabled');
    else {
      chip.classList.add('disabled');
      if (state.cat1.has(v)) {
        state.cat1.delete(v);
        chip.classList.remove('active');
      }
    }
  });
}

function applyFilters() {
  const q = state.search.trim().toLowerCase();
  let rows = DATA.filter(d => {
    if (state.cat1.size && !state.cat1.has(d.cat1)) return false;
    if (state.cat2.size && !state.cat2.has(d.cat2)) return false;
    if (q) {
      const hay = (d.title + ' ' + d.instructor + ' ' + d.summary + ' ' + d.goal + ' ' + d.target + ' ' + d.curriculum).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  if (state.sortKey) {
    const k = state.sortKey, dir = state.sortDir === 'asc' ? 1 : -1;
    rows = [...rows].sort((a, b) => {
      let va = a[k] || '', vb = b[k] || '';
      if (k === 'contents') { va = parseInt(va) || 0; vb = parseInt(vb) || 0; }
      else if (k === 'duration') { va = durToSec(va); vb = durToSec(vb); }
      else { va = String(va); vb = String(vb); }
      if (va < vb) return -1 * dir;
      if (va > vb) return 1 * dir;
      return 0;
    });
  } else {
    // Default: NEW items float to the top (stable within group)
    rows = [...rows].sort((a, b) => (b.isNew ? 1 : 0) - (a.isNew ? 1 : 0));
  }
  return rows;
}

function durToSec(s) {
  if (!s) return 0;
  const p = s.split(':').map(n => parseInt(n) || 0);
  if (p.length === 3) return p[0]*3600 + p[1]*60 + p[2];
  if (p.length === 2) return p[0]*60 + p[1];
  return 0;
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function highlightSearch(text) {
  const escaped = escapeHtml(text);
  const q = (state.search || '').trim();
  if (!q) return escaped;
  const reSrc = escapeHtml(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  if (!reSrc) return escaped;
  try {
    const re = new RegExp(reSrc, 'gi');
    return escaped.replace(re, m => '<mark class="hl">' + m + '</mark>');
  } catch (e) {
    return escaped;
  }
}

// Highlight "카테고리 전체 선택" button when every category chip is selected
function updateSelectAllState() {
  const chips = document.querySelectorAll('#filter-cat1 .chip, #filter-cat2 .chip');
  const allActive = chips.length > 0 &&
    [...chips].every(c => c.classList.contains('active'));
  const btn = document.getElementById('select-all-btn');
  if (btn) btn.classList.toggle('active', allActive);
}

function render() {
  const rows = applyFilters();
  document.getElementById('total-count').textContent = DATA.length;
  document.getElementById('filtered-count').textContent = rows.length;
  updateSelectAllState();
  const tbody = document.getElementById('data-tbody');
  tbody.innerHTML = '';
  if (!rows.length) {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td colspan="7" class="empty">조건에 맞는 과정이 없습니다.</td>';
    tbody.appendChild(tr);
    return;
  }
  rows.forEach((d, i) => {
    const tr = document.createElement('tr');
    const isExp = state.expanded.has(d.title);
    if (isExp) tr.classList.add('expanded');
    tr.innerHTML =
      '<td class="col-seq">' + (i + 1) + '</td>' +
      '<td class="col-cat">' + escapeHtml(d.cat1) + '</td>' +
      '<td class="col-cat">' + escapeHtml(d.cat2) + '</td>' +
      '<td class="col-title">' + highlightSearch(d.title) + (d.isNew ? '<span class="new-badge">NEW</span>' : '') + '</td>' +
      '<td class="col-num">' + escapeHtml(d.duration) + '</td>' +
      '<td class="col-num">' + escapeHtml(d.contents) + '</td>' +
      '<td class="col-inst">' + highlightSearch(d.instructor) + '</td>';
    tbody.appendChild(tr);

    const detail = document.createElement('tr');
    detail.className = 'detail-row' + (isExp ? ' show' : '');
    detail.innerHTML =
      '<td colspan="7"><div class="detail-grid">' +
        '<div class="detail-block"><h4>요약</h4><p>' + highlightSearch(d.summary) + '</p></div>' +
        '<div class="detail-block"><h4>학습 목표</h4><p>' + highlightSearch(d.goal) + '</p></div>' +
        '<div class="detail-block"><h4>학습 대상</h4><p>' + highlightSearch(d.target) + '</p></div>' +
        '<div class="detail-block detail-curriculum"><h4>커리큘럼</h4><p>' + highlightSearch(d.curriculum) + '</p></div>' +
      '</div></td>';
    tbody.appendChild(detail);

    tr.querySelector('.col-title').addEventListener('click', () => {
      if (state.expanded.has(d.title)) state.expanded.delete(d.title);
      else state.expanded.add(d.title);
      tr.classList.toggle('expanded');
      detail.classList.toggle('show');
    });
  });
}

document.getElementById('search-input').addEventListener('input', e => {
  state.search = e.target.value;
  render();
});

document.getElementById('reset-btn').addEventListener('click', () => {
  state.cat1.clear(); state.cat2.clear();
  state.search = ''; state.sortKey = null; state.expanded.clear();
  document.getElementById('search-input').value = '';
  document.querySelectorAll('.chip.active').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.chip.disabled').forEach(c => c.classList.remove('disabled'));
  document.querySelectorAll('th.sort-asc, th.sort-desc').forEach(t => {
    t.classList.remove('sort-asc', 'sort-desc');
    const ind = t.querySelector('.sort-ind');
    if (ind) ind.textContent = '▼';
  });
  render();
});

document.getElementById('select-all-btn').addEventListener('click', () => {
  // Select every cat1 and cat2 chip
  state.cat1.clear();
  state.cat2.clear();
  document.querySelectorAll('#filter-cat1 .chip').forEach(chip => {
    state.cat1.add(chip.dataset.value);
    chip.classList.add('active');
    chip.classList.remove('disabled');
  });
  document.querySelectorAll('#filter-cat2 .chip').forEach(chip => {
    state.cat2.add(chip.dataset.value);
    chip.classList.add('active');
    chip.classList.remove('disabled');
  });
  // Include items with empty cat1/cat2 so "전체 선택" really means all 214
  state.cat1.add('');
  state.cat2.add('');
  render();
});

document.getElementById('print-btn').addEventListener('click', () => window.print());

document.getElementById('export-btn').addEventListener('click', () => {
  const rows = applyFilters();
  if (!rows.length) { alert('내려받을 데이터가 없습니다.'); return; }
  const header = ['순번','카테고리1','카테고리2','과정명','학습시간','콘텐츠수','강사','요약','학습목표','학습대상','커리큘럼'];
  const aoa = [header, ...rows.map((d, i) => [i+1, d.cat1, d.cat2, d.title, d.duration, d.contents, d.instructor, d.summary, d.goal, d.target, d.curriculum])];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch:6},{wch:12},{wch:14},{wch:50},{wch:11},{wch:9},{wch:18},{wch:60},{wch:50},{wch:40},{wch:60}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'AX Academy 과정');
  XLSX.writeFile(wb, '스마트러닝_AX_Academy 인증 과정 목록.xlsx');
});

document.querySelectorAll('th[data-sort]').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.sort;
    if (state.sortKey === key) state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
    else { state.sortKey = key; state.sortDir = 'asc'; }
    document.querySelectorAll('th[data-sort]').forEach(t => {
      t.classList.remove('sort-asc', 'sort-desc');
      const ind = t.querySelector('.sort-ind');
      if (ind) ind.textContent = '▼';
    });
    th.classList.add(state.sortDir === 'asc' ? 'sort-asc' : 'sort-desc');
    const ind = th.querySelector('.sort-ind');
    if (ind) ind.textContent = state.sortDir === 'asc' ? '▲' : '▼';
    render();
  });
});

buildChips();
render();
</script>
</body>
</html>

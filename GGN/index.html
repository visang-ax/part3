<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1320, initial-scale=1.0, viewport-fit=cover">
<title>길가는 교회 탁구 18강 토너먼트</title>
<style>
  :root{
    --green:#168336;
    --green-dark:#0d6f2b;
    --ink:#101419;
    --line:#252a30;
    --border:#555b62;
    --paper:#ffffff;
    --lost:#d7dce0;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  @font-face{
    font-family:"GMarketSans";
    src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff") format("woff");
    font-weight:500;
    font-display:swap;
  }

  @font-face{
    font-family:"GMarketSans";
    src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff") format("woff");
    font-weight:700;
    font-display:swap;
  }

  html,body{
    width:100%;
    height:100%;
    min-width:1320px;
    min-height:930px;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
  }

  body{
    font-family:"GMarketSans","Malgun Gothic","Pretendard","Noto Sans KR",Arial,sans-serif;
    background:#fff;
    color:var(--ink);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  #stage{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
    overflow:hidden;
  }

  #canvas{
    position:relative;
    width:1320px;
    height:930px;
    transform-origin:center center;
    background:#fff;
  }

  #wires{
    position:absolute;
    inset:0;
    width:1320px;
    height:930px;
    pointer-events:none;
  }

  #wires path{
    fill:none;
    stroke:var(--line);
    stroke-width:2.2;
    stroke-linecap:square;
    stroke-linejoin:miter;
  }

  #wires path.win-wire{
    stroke:var(--green);
    stroke-width:4;
  }

  #wires path.lost-wire{
    opacity:.18;
    filter:blur(.45px);
  }

  .title-wrap{
    position:absolute;
    top:8px;
    left:0;
    right:0;
    z-index:3;
    text-align:center;
  }

  .title{
    color:var(--green-dark);
    font-size:66px;
    font-weight:700;
    line-height:1;
  }

  .subtitle{
    margin-top:14px;
    color:#05080b;
    font-size:35px;
    font-weight:700;
    line-height:1.1;
  }

  .group-pill{
    position:absolute;
    z-index:3;
    display:flex;
    align-items:center;
    justify-content:center;
    width:88px;
    height:40px;
    padding-top:3px;
    border-radius:7px;
    background:linear-gradient(180deg,#10943a 0%,#047a27 100%);
    color:#fff;
    font-size:29px;
    line-height:1;
  }

  .box{
    position:absolute;
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    padding:0 10px;
    background:var(--paper);
    border:1.8px solid var(--border);
    border-radius:9px;
    box-shadow:0 1px 3px rgba(0,0,0,.08);
    text-align:center;
    cursor:pointer;
    transition:background .16s,border-color .16s,box-shadow .16s,transform .12s;
  }

  .box:not(.editing):hover{ border-color:var(--green); }
  .box:not(.editing):active{ transform:translateY(1px); }
  .box.editing{ cursor:text; }

  .box .txt{
    min-width:10px;
    max-width:100%;
    outline:none;
    border-radius:3px;
    pointer-events:none;
    white-space:nowrap;
  }

  .box.editing .txt{
    pointer-events:auto;
    cursor:text;
  }

  .box .txt:focus{
    background:#eef8f1;
    box-shadow:0 0 0 2px #cdebd5;
  }

  .team .txt{
    font-size:18px;
    line-height:1;
    transform:translateY(2px);
    color:#05080b;
  }

  .winner .txt{
    font-size:15px;
    font-weight:500;
    color:#11161c;
  }

  .seed .txt{
    white-space:pre;
    font-size:18px;
    line-height:1.4;
    color:#11161c;
  }

  .champ .txt{
    font-size:22px;
    font-weight:700;
    color:var(--green);
  }

  .final .txt{
    font-size:35px;
    font-weight:700;
    line-height:1;
    transform:translateY(3px);
    color:var(--green);
  }

  .box.won{
    background:#e8f6ec;
    border-color:var(--green);
    box-shadow:0 2px 8px rgba(22,131,54,.24);
  }

  .box.won .txt{ color:var(--green-dark) !important; }

  .box.lost{
    opacity:1;
    filter:blur(.45px) grayscale(.4);
    background:#fafafa;
    border-color:var(--lost);
    box-shadow:none;
  }

  .box.lost .txt{ color:var(--lost) !important; }

  .box.won.lost{
    opacity:1;
    filter:blur(.45px) grayscale(.4);
    background:#fafafa;
    border-color:#d8dde1;
    box-shadow:none;
  }

  .box.won.lost .txt{ color:var(--lost) !important; }

  .box.final.champ-win{
    background:var(--green);
    border-color:var(--green-dark);
    box-shadow:0 4px 16px rgba(22,131,54,.38);
  }

  .box.final.champ-win .txt{ color:#fff !important; }

  .burst{
    position:fixed;
    inset:0;
    z-index:60;
    pointer-events:none;
  }

  .spark{
    position:absolute;
    left:var(--x);
    top:var(--y);
    width:16px;
    height:16px;
    border-radius:50%;
    background:var(--spark,#fff);
    opacity:0;
    animation:firework .58s ease-out forwards;
    transform:rotate(var(--a)) translateX(0) scale(.6);
  }

  @keyframes firework{
    0%{ opacity:1; transform:rotate(var(--a)) translateX(0) scale(.6); }
    72%{ opacity:1; transform:rotate(var(--a)) translateX(var(--d)) scale(1); }
    100%{ opacity:0; transform:rotate(var(--a)) translateX(calc(var(--d) + 10px)) scale(.25); }
  }

  .legend{
    position:absolute;
    left:372px;
    top:735px;
    z-index:3;
    width:575px;
    padding:16px 32px 15px 56px;
    border:3px solid var(--green-dark);
    border-radius:14px;
    background:#fff;
  }

  .legend li{
    font-size:23px;
    line-height:1.55;
    color:#05080b;
    white-space:nowrap;
  }

  .legend li::marker{
    font-size:18px;
    color:#05080b;
  }

  #resetBtn{
    position:fixed;
    right:18px;
    bottom:18px;
    z-index:30;
    min-width:86px;
    height:40px;
    padding:0 16px;
    border:2px solid var(--green-dark);
    border-radius:8px;
    background:#fff;
    color:var(--green-dark);
    font-family:inherit;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
  }

  #resetBtn:hover{ background:#edf8f0; }

  @media (max-width:1319px){
    html,body{ min-width:0; min-height:0; }
  }

  @media print{
    body{ overflow:visible; }
  }
</style>
</head>
<body>
  <button id="resetBtn" type="button">초기화</button>
  <div id="stage">
    <div id="canvas">
      <svg id="wires" viewBox="0 0 1320 930"></svg>
      <div class="title-wrap">
        <div class="title">18강 토너먼트 구조</div>
        <div class="subtitle">A조 9팀 / B조 9팀 → 각 조 우승팀 결승</div>
      </div>
      <div class="group-pill" style="left:55px; top:126px;">A조</div>
      <div class="group-pill" style="right:55px; top:126px;">B조</div>
      <div class="legend">
        <ul>
          <li>각 조 9팀으로 진행</li>
          <li>7번 · 8번 승자와 9번이 한 번 더 경기</li>
          <li>7번 · 8번 · 9번은 2승 후 조 4강 진출</li>
          <li>각 조 우승팀이 결승 진출</li>
        </ul>
      </div>
    </div>
  </div>

<script>
(function(){
  var W = 1320, H = 930;
  var teamY = [205, 265, 325, 385, 445, 505, 565, 625, 685];

  var COL = {
    team:{x:22, w:103},
    win:{x:209, w:108},
    seed:{x:372, w:122},
    champ:{x:455, w:128},
    champR:{x:735, w:128},
    final:{x:612, w:96}
  };

  var Hteam = 45;
  var Hwin = 56;
  var Hseed = 74;
  var Hchamp = 77;
  var Hfinal = 77;

  function avg(a,b){ return (a+b)/2; }
  function mx(x,w){ return W - x - w; }

  var boxes = [];
  function add(o){ boxes.push(o); return o; }

  for(var i=0;i<9;i++){
    add({id:"tL"+(i+1), x:COL.team.x, y:teamY[i], w:COL.team.w, h:Hteam, cls:"team", label:(i+1)+"번"});
  }

  var winnerY = [
    avg(teamY[0],teamY[1]),
    avg(teamY[2],teamY[3]),
    avg(teamY[4],teamY[5]),
    avg(teamY[6],teamY[7]),
    teamY[8]
  ];

  for(i=0;i<5;i++){
    add({id:"wL"+(i+1), x:COL.win.x, y:winnerY[i], w:COL.win.w, h:Hwin, cls:"winner", label:"winner A"+(i+1)});
  }

  var seedY1 = avg(winnerY[0],winnerY[1]);
  var seedY2 = avg(winnerY[2],winnerY[4]);
  var champY = avg(seedY1,seedY2);

  add({id:"sL1", x:COL.seed.x, y:seedY1, w:COL.seed.w, h:Hseed, cls:"seed", label:"A조 결승\n진출팀 1"});
  add({id:"sL2", x:COL.seed.x, y:seedY2, w:COL.seed.w, h:Hseed, cls:"seed", label:"A조 결승\n진출팀 2"});
  add({id:"cL", x:COL.champ.x, y:champY, w:COL.champ.w, h:Hchamp, cls:"champ", label:"A조 우승"});
  add({id:"F", x:COL.final.x, y:champY, w:COL.final.w, h:Hfinal, cls:"final", label:"결승"});

  for(i=0;i<9;i++){
    add({id:"tR"+(i+1), x:mx(COL.team.x,COL.team.w), y:teamY[i], w:COL.team.w, h:Hteam, cls:"team", label:(i+1)+"번"});
  }

  for(i=0;i<5;i++){
    add({id:"wR"+(i+1), x:mx(COL.win.x,COL.win.w), y:winnerY[i], w:COL.win.w, h:Hwin, cls:"winner", label:"winner B"+(i+1)});
  }

  add({id:"sR1", x:mx(COL.seed.x,COL.seed.w), y:seedY1, w:COL.seed.w, h:Hseed, cls:"seed", label:"B조 결승\n진출팀 1"});
  add({id:"sR2", x:mx(COL.seed.x,COL.seed.w), y:seedY2, w:COL.seed.w, h:Hseed, cls:"seed", label:"B조 결승\n진출팀 2"});
  add({id:"cR", x:COL.champR.x, y:champY, w:COL.champR.w, h:Hchamp, cls:"champ", label:"B조 우승"});

  function getBox(id){
    for(var i=0;i<boxes.length;i++){
      if(boxes[i].id===id) return boxes[i];
    }
  }

  function edges(b){
    return {
      L:b.x,
      R:b.x+b.w,
      T:b.y-b.h/2,
      B:b.y+b.h/2,
      CX:b.x+b.w/2,
      CY:b.y
    };
  }

  var c0 = 168;
  var c1 = 340;
  var c2 = 522;
  var matches = [
    {kids:["tL1","tL2"], pid:"wL1", busX:c0, side:"L", type:"pair"},
    {kids:["tL3","tL4"], pid:"wL2", busX:c0, side:"L", type:"pair"},
    {kids:["tL5","tL6"], pid:"wL3", busX:c0, side:"L", type:"pair"},
    {kids:["tL7","tL8"], pid:"wL4", busX:c0, side:"L", type:"pair"},
    {kids:["wL4","tL9"], pid:"wL5", side:"L", type:"bye"},
    {kids:["wL1","wL2"], pid:"sL1", busX:c1, side:"L", type:"pair"},
    {kids:["wL3","wL5"], pid:"sL2", busX:c1, side:"L", type:"pair"},
    {kids:["sL1","sL2"], pid:"cL", busX:c2, side:"L", type:"pair"},
    {kids:["tR1","tR2"], pid:"wR1", busX:W-c0, side:"R", type:"pair"},
    {kids:["tR3","tR4"], pid:"wR2", busX:W-c0, side:"R", type:"pair"},
    {kids:["tR5","tR6"], pid:"wR3", busX:W-c0, side:"R", type:"pair"},
    {kids:["tR7","tR8"], pid:"wR4", busX:W-c0, side:"R", type:"pair"},
    {kids:["wR4","tR9"], pid:"wR5", side:"R", type:"bye"},
    {kids:["wR1","wR2"], pid:"sR1", busX:W-c1, side:"R", type:"pair"},
    {kids:["wR3","wR5"], pid:"sR2", busX:W-c1, side:"R", type:"pair"},
    {kids:["sR1","sR2"], pid:"cR", busX:W-c2, side:"R", type:"pair"},
    {kids:["cL","cR"], pid:"F", type:"final"}
  ];

  var matchByKid = {};
  var matchByParent = {};
  matches.forEach(function(m){
    matchByParent[m.pid] = m;
    m.kids.forEach(function(k){ matchByKid[k] = m; });
  });

  var svg = document.getElementById("wires");
  var NS = "http://www.w3.org/2000/svg";

  function dStr(pts){
    var d = "M"+pts[0][0]+" "+pts[0][1];
    for(var i=1;i<pts.length;i++) d += "L"+pts[i][0]+" "+pts[i][1];
    return d;
  }

  function draw(pts, cls){
    var el = document.createElementNS(NS,"path");
    el.setAttribute("d",dStr(pts));
    if(cls) el.setAttribute("class",cls);
    svg.appendChild(el);
    return el;
  }

  function kidConn(e,side){ return side==="L" ? e.R : e.L; }
  function parConn(e,side){ return side==="L" ? e.L : e.R; }

  matches.forEach(function(m){
    var P = edges(getBox(m.pid));
    m.linesByKid = {};

    if(m.type==="pair"){
      var A = edges(getBox(m.kids[0]));
      var B = edges(getBox(m.kids[1]));
      m.linesByKid[m.kids[0]] = [draw([[kidConn(A,m.side),A.CY],[m.busX,A.CY]])];
      m.linesByKid[m.kids[1]] = [draw([[kidConn(B,m.side),B.CY],[m.busX,B.CY]])];
      m.linesByKid[m.kids[0]].push(draw([[m.busX,A.CY],[m.busX,P.CY]]));
      m.linesByKid[m.kids[1]].push(draw([[m.busX,B.CY],[m.busX,P.CY]]));
      if(m.pid !== "cL" && m.pid !== "cR"){
        m.parentLine = draw([[m.busX,P.CY],[parConn(P,m.side),P.CY]]);
      }
    }

    if(m.type==="bye"){
      var W4 = edges(getBox(m.kids[0]));
      var T9 = edges(getBox(m.kids[1]));
      m.linesByKid[m.kids[1]] = [draw([[kidConn(T9,m.side),T9.CY],[parConn(P,m.side),P.CY]])];
      m.linesByKid[m.kids[0]] = [draw([[W4.CX,W4.B],[W4.CX,P.T]])];
    }

    if(m.type==="final"){
      var L = edges(getBox(m.kids[0]));
      var R = edges(getBox(m.kids[1]));
      m.linesByKid[m.kids[0]] = [draw([[L.R,L.CY],[P.L,P.CY]])];
      m.linesByKid[m.kids[1]] = [draw([[P.R,P.CY],[R.L,R.CY]])];
    }
  });

  matches.forEach(function(m){
    var el = document.createElementNS(NS,"path");
    el.setAttribute("class","win-wire");
    el.style.display = "none";
    svg.appendChild(el);
    m.green = el;
  });

  var canvas = document.getElementById("canvas");
  var store = {};
  try{ store = JSON.parse(localStorage.getItem("pp_bracket_18") || "{}"); }
  catch(e){ store = {}; }

  var winSel = store.__win || {};
  var defLabel = {};
  var boxEl = {};
  var txtEl = {};
  var editingId = null;

  function save(){
    store.__win = winSel;
    try{ localStorage.setItem("pp_bracket_18", JSON.stringify(store)); }
    catch(e){}
  }

  function baseLabel(id){
    return store[id] !== undefined && store[id] !== "" ? store[id] : defLabel[id];
  }

  function displayText(id){
    if(winSel[id]) return displayText(winSel[id]);
    return baseLabel(id);
  }

  boxes.forEach(function(b){
    defLabel[b.id] = b.label;

    var box = document.createElement("div");
    box.className = "box " + b.cls;
    box.style.left = b.x + "px";
    box.style.top = (b.y - b.h/2) + "px";
    box.style.width = b.w + "px";
    box.style.height = b.h + "px";

    var txt = document.createElement("div");
    txt.className = "txt";
    txt.spellcheck = false;
    txt.contentEditable = "false";
    box.appendChild(txt);

    boxEl[b.id] = box;
    txtEl[b.id] = txt;

    var clickTimer = null;
    box.addEventListener("click",function(){
      if(editingId === b.id) return;
      clearTimeout(clickTimer);
      clickTimer = setTimeout(function(){ toggleWin(b.id); }, 220);
    });

    box.addEventListener("dblclick",function(){
      clearTimeout(clickTimer);
      editingId = b.id;
      txt.contentEditable = "true";
      box.classList.add("editing");
      txt.focus();

      var range = document.createRange();
      range.selectNodeContents(txt);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    });

    txt.addEventListener("blur",function(){
      if(editingId !== b.id) return;
      var value = txt.textContent.replace(/\s+$/,"");
      if(value === defLabel[b.id]) delete store[b.id];
      else store[b.id] = value;
      editingId = null;
      txt.contentEditable = "false";
      box.classList.remove("editing");
      save();
      recompute(false);
    });

    txt.addEventListener("keydown",function(e){
      if(e.key === "Enter"){
        e.preventDefault();
        txt.blur();
      }
    });

    canvas.appendChild(box);
  });

  function clearNextWins(parent){
    while(matchByKid[parent]){
      var pm = matchByKid[parent];
      delete winSel[pm.pid];
      parent = pm.pid;
    }
  }

  function setSecondFinalTeam(seedId, id){
    delete store[seedId];
    winSel[seedId] = id;
    clearNextWins(seedId);
  }

  function clearSecondFinalTeam(seedId){
    delete store[seedId];
    delete winSel[seedId];
    clearNextWins(seedId);
  }

  if(store.sL2 && !winSel.sL2 && winSel.wL5 !== "wL4"){
    delete store.sL2;
    save();
  }
  if(store.sR2 && !winSel.sR2 && winSel.wR5 !== "wR4"){
    delete store.sR2;
    save();
  }
  if(winSel.wL5 === "wL4"){ winSel.wL5 = "tL9"; save(); }
  if(winSel.wR5 === "wR4"){ winSel.wR5 = "tR9"; save(); }

  function toggleWin(id){
    var m = matchByKid[id];
    if(!m) return;

    if(id === "wL4"){
      winSel.wL5 = "tL9";
      delete store.wL5;
      if(winSel.sL2 === "wL4"){
        delete winSel.sL2;
        clearNextWins("sL2");
      }else{
        setSecondFinalTeam("sL2","wL4");
      }
      save();
      recompute(true);
      return;
    }

    if(id === "wR4"){
      winSel.wR5 = "tR9";
      delete store.wR5;
      if(winSel.sR2 === "wR4"){
        delete winSel.sR2;
        clearNextWins("sR2");
      }else{
        setSecondFinalTeam("sR2","wR4");
      }
      save();
      recompute(true);
      return;
    }

    if(id === "tL9" && m.pid === "wL5"){
      winSel.wL5 = "tL9";
      delete store.wL5;
      if(winSel.sL2 === "wL4") winSel.sL2 = "wL5";
      if(store.sL2) delete store.sL2;
      save();
      recompute(true);
      return;
    }

    if(id === "tR9" && m.pid === "wR5"){
      winSel.wR5 = "tR9";
      delete store.wR5;
      if(winSel.sR2 === "wR4") winSel.sR2 = "wR5";
      if(store.sR2) delete store.sR2;
      save();
      recompute(true);
      return;
    }

    for(var i=0;i<m.kids.length;i++){
      var kid = m.kids[i];
      if(matchByParent[kid] && !winSel[kid]){
        alert("승리팀을 선택하세요.");
        return;
      }
    }

    if(matchByParent[id] && !winSel[id]){
      alert("승리팀을 선택하세요.");
      return;
    }

    var selected = false;
    if(winSel[m.pid] === id){
      delete winSel[m.pid];
      clearNextWins(m.pid);
    }else{
      winSel[m.pid] = id;
      selected = true;
    }

    if(id === "wL3" || id === "wL4" || id === "wL5"){
      if(selected) setSecondFinalTeam("sL2", id);
      else clearSecondFinalTeam("sL2");
    }

    if(id === "wR3" || id === "wR4" || id === "wR5"){
      if(selected) setSecondFinalTeam("sR2", id);
      else clearSecondFinalTeam("sR2");
    }

    save();
    recompute(true);
  }

  function routeD(m,kid){
    var P = edges(getBox(m.pid));
    var K = edges(getBox(kid));

    if(m.type === "final"){
      return kid === m.kids[0]
        ? dStr([[K.R,K.CY],[P.L,P.CY]])
        : dStr([[P.R,P.CY],[K.L,K.CY]]);
    }

    if(m.type === "bye"){
      if(kid === m.kids[1]) return dStr([[kidConn(K,m.side),K.CY],[parConn(P,m.side),P.CY]]);
      return dStr([[K.CX,K.B],[K.CX,P.T]]);
    }

    if(m.pid === "cL" || m.pid === "cR"){
      return dStr([[kidConn(K,m.side),K.CY],[m.busX,K.CY],[m.busX,P.CY]]);
    }

    return dStr([[kidConn(K,m.side),K.CY],[m.busX,K.CY],[m.busX,P.CY],[parConn(P,m.side),P.CY]]);
  }

  function showWinWire(el,d,animate){
    var oldD = el.getAttribute("d");
    var wasHidden = el.style.display === "none";
    el.setAttribute("d",d);
    el.style.display = "";

    var len = 0;
    try{ len = el.getTotalLength(); }
    catch(e){ len = 0; }

    if(!len){
      el.style.transition = "";
      el.style.strokeDasharray = "";
      el.style.strokeDashoffset = "";
      return;
    }

    el.style.strokeDasharray = len;
    if(animate && (wasHidden || oldD !== d)){
      el.style.transition = "none";
      el.style.strokeDashoffset = len;
      el.getBoundingClientRect();
      el.style.transition = "stroke-dashoffset .42s ease";
      el.style.strokeDashoffset = "0";
    }else{
      el.style.transition = "none";
      el.style.strokeDashoffset = "0";
    }
  }

  function hideWinWire(el){
    el.style.transition = "none";
    el.style.display = "none";
    el.style.strokeDasharray = "";
    el.style.strokeDashoffset = "";
  }

  var finalRevealTimer = null;

  function fireworkFinal(done){
    var old = document.querySelector(".burst");
    if(old) old.remove();

    var burst = document.createElement("div");
    burst.className = "burst";
    var colors = ["#ffffff","#dff8e6","#76d58b","#168336","#ffe66d"];
    for(var i=0;i<56;i++){
      var spark = document.createElement("span");
      spark.className = "spark";
      spark.style.setProperty("--x", "50%");
      spark.style.setProperty("--y", "48%");
      spark.style.setProperty("--a", (i * 6.43) + "deg");
      spark.style.setProperty("--d", (260 + (i % 7) * 42) + "px");
      spark.style.setProperty("--spark", colors[i % colors.length]);
      burst.appendChild(spark);
    }

    document.body.appendChild(burst);
    clearTimeout(finalRevealTimer);
    finalRevealTimer = setTimeout(function(){
      burst.remove();
      done();
    }, 620);
  }

  function recompute(animate){
    var wonSet = {};
    var lostSet = {};
    for(var k in winSel) wonSet[winSel[k]] = true;

    boxes.forEach(function(b){
      var picked = winSel[b.id];
      if(picked && displayText(b.id) === displayText(picked)){
        wonSet[b.id] = true;
      }
    });

    matches.forEach(function(m){
      if(!winSel[m.pid]) return;
      m.kids.forEach(function(kid){
        if((m.pid === "wL5" && kid === "wL4" && winSel.sL2 !== "wL5") ||
           (m.pid === "wR5" && kid === "wR4" && winSel.sR2 !== "wR5")) return;
        if(kid !== winSel[m.pid]) lostSet[kid] = true;
      });
    });

    function markLostPath(id){
      var picked = winSel[id];
      if(!picked || lostSet[picked]) return;
      lostSet[picked] = true;
      markLostPath(picked);
    }

    boxes.forEach(function(b){
      if(lostSet[b.id]) markLostPath(b.id);
    });

    if(winSel.sL2 === "wL3"){
      lostSet.wL4 = true;
      lostSet.wL5 = true;
      markLostPath("wL4");
      markLostPath("wL5");
    }

    if(winSel.sR2 === "wR3"){
      lostSet.wR4 = true;
      lostSet.wR5 = true;
      markLostPath("wR4");
      markLostPath("wR5");
    }

    var finalText = displayText("F");
    var shouldRevealFinal = animate && !!winSel.F && txtEl.F.textContent !== finalText;

    boxes.forEach(function(b){
      if(editingId !== b.id) txtEl[b.id].textContent = displayText(b.id);
      boxEl[b.id].classList.toggle("won", !!wonSet[b.id]);
      boxEl[b.id].classList.toggle("lost", !!lostSet[b.id]);
    });

    boxEl.F.classList.toggle("champ-win", !!winSel.F);

    if(shouldRevealFinal){
      txtEl.F.textContent = "";
      fireworkFinal(function(){
        txtEl.F.textContent = finalText;
      });
    }

    matches.forEach(function(m){
      if(m.linesByKid){
        m.kids.forEach(function(kid){
          var lines = m.linesByKid[kid] || [];
          lines.forEach(function(line){
            var bridgeLost = (m.pid === "wL5" && kid === "wL4" && winSel.sL2 === "wL4") ||
                             (m.pid === "wR5" && kid === "wR4" && winSel.sR2 === "wR4");
            line.classList.toggle("lost-wire", !!lostSet[kid] || bridgeLost);
          });
        });
      }
      if(m.parentLine){
        m.parentLine.classList.toggle("lost-wire", !!lostSet[m.pid]);
      }

      if(winSel[m.pid]){
        if(lostSet[m.pid]){
          hideWinWire(m.green);
        }else{
          showWinWire(m.green, routeD(m, winSel[m.pid]), !!animate);
        }
      }else{
        hideWinWire(m.green);
      }
    });
  }

  document.getElementById("resetBtn").addEventListener("click",function(){
    if(!confirm("입력한 이름과 선택한 승자 표시를 모두 초기화할까요?")) return;
    store = {};
    winSel = {};
    save();
    recompute(false);
  });

  function viewportSize(){
    var vv = window.visualViewport;
    var root = document.documentElement;
    return {
      w: Math.max(root.clientWidth || 0, window.innerWidth || 0, vv ? vv.width : 0),
      h: Math.max(root.clientHeight || 0, window.innerHeight || 0, vv ? vv.height : 0)
    };
  }

  function fit(){
    var size = viewportSize();
    var pad = size.w >= W ? 20 : 0;
    var scale = Math.min((size.w - pad*2) / W, (size.h - pad*2) / H);
    canvas.style.transform = "scale(" + Math.min(scale, 1.18) + ")";
  }

  window.addEventListener("resize",fit);
  window.addEventListener("orientationchange",fit);
  if(window.visualViewport){
    window.visualViewport.addEventListener("resize",fit);
  }
  recompute(false);
  fit();
})();
</script>
